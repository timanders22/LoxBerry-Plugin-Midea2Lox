Z1_25 = "Status | Klima (Midea) | Rows: V1 < 0 “state unknown – the device does not report whether it runs; read status ‘Zustand (Midea)’”; V2 < -100 “room temperature missing – the device supplies no room value; in the plugin tab Test ‘Query the state of all devices’”; V1 = 1 and V4 < -100 “running – room <v2.1> °C, target <v3.1> °C (the device currently supplies no outdoor temperature)”; V1 = 1 and V5 < 0 “running – room <v2.1> °C, target <v3.1> °C, outside <v4.1> °C”; V1 = 1 “running – room <v2.1> °C, target <v3.1> °C, outside <v4.1> °C, humidity <v5> per cent”; V6 = 0 and V4 < -100 “off – room <v2.1> °C”; V6 = 0 “off – room <v2.1> °C, outside <v4.1> °C”; V7 = 0 “blocked – window open for more than 1 minute or nobody at home; switches on again by itself”; without condition “switched on, but the device reports off – switched off at the device or with the remote control, or are the ticks for MQTT commands missing in the plugin? Switch ‘Klima ein (Midea)’ off and on again”; visualisation ON | V1 = #11, V2 = #12, V3 = #14, V4 = #13, V5 = #15, V6 = #16, V7 = #20"
