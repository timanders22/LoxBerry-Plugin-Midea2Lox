Z1_03 = "Virtual Input (name as assigned by the MQTT gateway, plugin Midea2Lox) | Midea2Lox_123456789012_online | 1 = the air conditioner answered the last query, 0 = not (in your own project your own device number stands here); arrives with every query (plugin polling interval 60 s); never retained; version 2: tick and “Noncached” | —"
