H_EINBINDUNG = "Loxone integration, step by step"
EINBINDUNG_EINLEITUNG = "Midea2Lox works in <b>both directions</b>: it reports the state of the air conditioners to Loxone and accepts commands from there."
EINBINDUNG_OHNE_GERAETE = "<b>No devices are configured yet.</b> The examples below therefore use the placeholder number %s. Please run a device search in the Test tab first - afterwards the real numbers appear here."
SCHRITT1 = "Step 1: choose the path - MQTT or UDP"
SCHRITT1_TEXT = "<b>MQTT</b> is the more convenient path. Since LoxBerry 3 the gateway is part of the system and does not have to be installed separately. <b>UDP</b> works without a gateway but needs one virtual UDP input with a pattern per value. <b>The plugin does not send both</b> - it chooses MQTT as soon as a broker can be reached and falls back to UDP otherwise."
SCHRITT2 = "Step 2: subscription in the MQTT gateway"
SCHRITT2_TEXT = "For the MQTT path only. To be entered under <i>System &rarr; MQTT Gateway &rarr; Subscriptions</i>:"
SCHRITT3 = "Step 3: create virtual inputs"
SCHRITT3_TEXT = "In <b>Loxone Config</b> click the Miniserver, then <i>Virtual inputs</i>. One input per value. <b>The title has to match exactly</b> - the gateway matches by name only."
TITEL_EINGANG = "Title of the virtual input"
UDP_WEG = "<b>For the UDP path</b> create a <i>virtual UDP input</i> on port <b>%s</b> instead, one command per value:"
UDP_MUSTER_ERKLAERUNG = "The pattern means: look for the text before <span class='sm-mono'>\i</span> and take the number that follows. For text values use <span class='sm-mono'>\v</span> instead of the number."
H_VORLAGE = "Create everything at once"
H_VORLAGE_TEXT = "Instead of creating every block by hand, the plugin generates two import files for Loxone Config: one with the <b>virtual inputs</b> and one with the <b>virtual output including every command</b>. Import them in Loxone Config via <i>File &rarr; Templates &rarr; Import template</i>. <b>What the input template contains and what it does not:</b> the seven text values in the table above get <i>no</i> virtual input - a virtual input carries a number, not text. In exchange the template also contains the four heartbeat inputs, which do not appear in the table above."
K_VORLAGE = "Create template of the inputs"
K_VORLAGE_AUS = "Create template of the commands"
VORLAGE_WARNUNG = "<b>Note:</b> Loxone Config always creates new objects on import and overwrites nothing. Importing twice yields duplicate blocks, and nobody notices."
SCHRITT4 = "Step 4: commands to the air conditioner"
SCHRITT4_TEXT = "To switch, create a <i>virtual output</i>. Address - %s is the LoxBerry, %s the configured UDP port:"
SCHRITT4_TEXT2 = "Below it add one <i>virtual output command</i> per command. The command text consists of the device number, a <b>space</b> and the command:"
