[BAUSTEIN]
Z1_01 = "Virtual HTTP Input Command (template “Midea Klimageraete”) | Midea2Lox_status_zaehler | Sign of life: counts up by one with every heartbeat of the plugin (every 60 s), 0 to 999, wraps around; arrives via the MQTT gateway (title = gateway name) | —"
Z1_02 = "Virtual HTTP Input Command (template “Midea Klimageraete”) | Midea2Lox_status_ok | last device poll: 1 succeeded, 0 failed, -1 none yet | —"
Z1_03 = "Virtual HTTP Input Command (template “Midea Klimageraete”) | Midea2Lox_123456789012_online | 1 = the air conditioner answered at the last poll, 0 = not (in your own project your own device number stands here) | —"
Z1_04 = "Constant | Konstante 1 | Value 1 | —"
Z1_05 = "Value Validator | Lebenszeichen fehlt (Midea) | Tmc 300 s (five signs of life of 60 s each without a new value), Min 0, Max 999 – if the LoxBerry, the MQTT gateway or the service stops, the counter stops; remove the tick at ‘En’ in the properties window | V = #1, En = #4"
Z1_06 = "NOT | Keine frischen Daten (Midea) | — (the air conditioner does not answer) | I = #3"
Z1_07 = "OR | Störung (Midea) | — (no fresh data or sign of life missing) | I1 = #6, I2 = output E of #5"
Z1_08 = "Switch-On Delay | Störung bestätigt (Midea) | 600 s (ten signs of life of 60 s each, with a polling interval of 60 s at the same time ten device polls; a single missed poll and a restart report nothing) | Input = #7"
Z1_09 = "Notification | Meldung Plugin gestört (Midea) | Text: Midea2Lox – the air conditioner has not answered for more than 10 minutes, or the plugin has not reported for about 15 minutes (LoxBerry, MQTT gateway or service stopped). Values in the app are old then, commands have no effect. Read the status “Zustand (Midea)” in the app, in the plugin tab Test “Query the state of all devices” | Input = #8"
Z1_10 = "Status | Zustand (Midea) | Rows: V1 = 1 “the plugin has not reported for at least 5 minutes – check LoxBerry, MQTT gateway (subscription Midea2Lox/#) and service; in the plugin tab Test ‘Check environment’”; V3 < 0 “the plugin runs but has not polled an air conditioner yet – in the plugin tab Test ‘Search for devices now’, then enter 60 at ‘Polling interval’ in the tab Settings”; V2 = 0 “the air conditioner does not answer – check power and Wi-Fi of the device; in the plugin tab Test ‘Query the state of all devices’”; without condition “running – air conditioner reachable, sign of life <v4>”; visualisation ON | V1 = output E of #5, V2 = #3, V3 = #2, V4 = #1"
Z1_11 = "Virtual HTTP Input Command (template “Midea Klimageraete”) | Midea2Lox_123456789012_power_state | 1 = device switched on, 0 = off (also when switched at the device or with the remote control) | —"
Z1_12 = "Virtual HTTP Input Command (template “Midea Klimageraete”) | Midea2Lox_123456789012_indoor_temperature | Room temperature at the indoor unit in °C; statistics on | —"
Z1_13 = "Virtual HTTP Input Command (template “Midea Klimageraete”) | Midea2Lox_123456789012_outdoor_temperature | Temperature at the outdoor unit in °C | —"
Z1_14 = "Virtual HTTP Input Command (template “Midea Klimageraete”) | Midea2Lox_123456789012_target_temperature | Target temperature the device currently has, in °C | —"
Z1_15 = "Virtual HTTP Input Command (template “Midea Klimageraete”) | Midea2Lox_123456789012_indoor_humidity | Room humidity in %%; 0 for devices without a humidity sensor | —"
Z1_16 = "Virtual Input (Switch) | Klima ein (Midea) | in the app: 1 = switch the air conditioner on, 0 = off; start value off | —"
Z1_17 = "Virtual Input (Switch) | Fenster offen (eigene Quelle) | 1 = a window in the room of the air conditioner is open; in the app for trying it out; in your own project connect your own window contact to no. 18 instead of this switch | —"
Z1_18 = "Switch-On Delay | Fenster länger offen (Midea) | 60 s (airing briefly does not switch the device off) | Input = #17"
Z1_19 = "Virtual Input (Switch) | Niemand zu Hause (eigene Quelle) | 1 = everybody is away (further instance, the same placeholder as on “Alexa NG”, “Intercom” and “Kodi-NG Wiedergabe”); in your own project connect your own presence to no. 20 instead of this switch | —"
Z1_20 = "AND | Klima darf laufen (Midea) | — (both inputs inverted: in Config click the input point, a small circle appears; 1 = no window open for long and somebody at home) | I1 = #18 (inverted), I2 = #19 (inverted)"
Z1_21 = "AND | Klima einschalten (Midea) | — (switch on and release) | I1 = #16, I2 = #20"
Z1_22 = "Virtual Output Command (template “Midea2Lox Befehle”) | Midea2Lox 123456789012 Ein- und ausschalten | Command for ON: switch the device on; command for OFF: switch the device off (also when the window opens or everybody leaves; afterwards on again as long as the switch is on) | Input = #21"
Z1_23 = "Virtual Input (Slider) | Solltemperatur (Midea) | Min 16, Max 30, step 0.5, start value 22 (°C); in the app | —"
Z1_24 = "Virtual Output Command (template “Midea2Lox Befehle”) | Midea2Lox 123456789012 Solltemperatur stufenlos | Command for analog value <v.1> (°C, half degrees work); a value outside the device range is discarded by the plugin | Input = #23"
Z1_25 = "Status | Klima (Midea) | Rows: V1 = 1 “running – room <v2.1> °C, target <v3.1> °C, outside <v4.1> °C, humidity <v5> %%”; V6 = 0 “off – room <v2.1> °C, outside <v4.1> °C”; V7 = 0 “blocked – window open for more than 1 minute or nobody at home; switches on again by itself”; without condition “switched on, but the device reports off – switched off at the device or with the remote control? Switch ‘Klima ein (Midea)’ off and on again”; visualisation ON | V1 = #11, V2 = #12, V3 = #14, V4 = #13, V5 = #15, V6 = #16, V7 = #20"
Z1_26 = "Virtual HTTP Input Command (template “Midea Klimageraete”) | Midea2Lox_automatik_aktiv | 1 = the automation of the plugin is currently shifting the target temperature (cheap electricity or PV surplus); only with the automation switched on (tab Automation, off by default) | —"
Z1_27 = "Virtual HTTP Input Command (template “Midea Klimageraete”) | Midea2Lox_automatik_gesperrt | Seconds the automation still rests after a command from Loxone (manual priority, 120 min by default) | —"
Z1_28 = "Virtual HTTP Input Command (template “Midea Klimageraete”) | Midea2Lox_automatik_geraete | Number of devices whose target temperature the automation is currently shifting | —"
Z1_29 = "Virtual Text Input | Midea2Lox_automatik_grund | create by hand, name exactly like this (the name the MQTT gateway assigns), “Use in User Interface” on; plain text why the automation acts or not; only with the automation switched on | —"
Z1_30 = "Status | Automatik (Midea) | Rows: V2 > 0 “manual priority – the automation still rests <v2> s (every command from Loxone suspends it)”; V1 = 1 “acting – shifts the target temperature of <v3> device(s); reason in the text input ‘Midea2Lox_automatik_grund’”; without condition “not acting (off, no signal or window open) – reason in the text input; switch it on in the plugin tab Automation”; visualisation ON | V1 = #26, V2 = #27, V3 = #28"
Z2_01 = "Radio Buttons | Betriebsart (Midea) | Button 1 “Automatik”, button 2 “Kühlen”, button 3 “Heizen”, button 4 “Entfeuchten”, button 5 “nur Lüften”; text for “no button selected”: “wie am Gerät”; remanence off (after a restart of the Miniserver nothing is sent) | —"
Z2_02 = "Virtual Output Command (template “Midea2Lox Befehle”) | Midea2Lox 123456789012 Betriebsart Automatik | Command for ON: operating mode automatic (the device then also sets the fan speed itself) | Input = output Q1 of #1"
