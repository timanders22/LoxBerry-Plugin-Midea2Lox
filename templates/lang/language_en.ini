WAS_IST_DAS = "<b>Air conditioners of the Midea group in Loxone – on your own network, without a detour through the manufacturer cloud.</b> A service on the LoxBerry receives the commands of the Miniserver over UDP and sends them through msmart-ng to the devices (Midea and brands such as Comfee, Kaisai or Qlima). It reports their state back over MQTT; Loxone reads it through the MQTT gateway. The manufacturer account is only needed for the device search, to fetch token and key for devices with protocol V3."
