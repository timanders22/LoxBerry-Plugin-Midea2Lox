Z1_01 = "Virtual Input (name as assigned by the MQTT gateway, plugin Midea2Lox) | Midea2Lox_status_zaehler | Sign of life: counts up by one with every heartbeat of the plugin (every 60 s), 0 to 999, wraps around; never retained; MQTT gateway version 2: tick | —"
