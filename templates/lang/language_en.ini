WAS_IST_DAS = "<b>Air conditioners of the Midea group in Loxone – on your own network, without a detour via the manufacturer cloud.</b> A service on the LoxBerry sends the commands of the Miniserver via msmart-ng to the devices (Midea and brands such as Comfee, Kaisai or Qlima) – via MQTT or, for existing installations, via UDP. It reports their state back via MQTT; Loxone reads it via the MQTT gateway. The manufacturer account is needed only for the device search, for token and key of devices with protocol V3."
