GRUPPE_STATUS = "Heartbeat of the plugin"
STATUS_ERKLAERUNG = "These four topics apply to the plugin, not to a single device. They answer the question a virtual input cannot answer by itself: <b>is this value from just now, or has it been frozen since the failure?</b> A virtual input keeps its last value, with retain even across a restart of the Miniserver - without a heartbeat a dead service looks exactly like a quiet one."
THEMEN_OHNE_GERAETE = "As soon as devices are configured, topics follow the pattern <span class='sm-mono'>%s/&lt;device number&gt;/&lt;value&gt;</span>."
MQTT_REGELWEG = "MQTT is the standard path."
UDP_AUSWEICHWEG = "If no broker can be reached, the service sends via HTTP to virtual inputs of the Miniserver - with the names from the Loxone integration tab (underscore instead of slash)."
H_EINBINDUNG = "Loxone integration, step by step"
EINBINDUNG_EINLEITUNG = "Midea2Lox works in <b>both directions</b>: it reports the state of the air conditioners to Loxone and accepts commands from there."
EINBINDUNG_OHNE_GERAETE = "<b>No devices are configured yet.</b> The examples below therefore use the placeholder number %s. Please run a device search in the Test tab first - afterwards the real numbers appear here."
SCHRITT1 = "Step 1: the path of the values – MQTT"
SCHRITT1_TEXT = "<b>MQTT</b> is the path: the service reports the state of the air conditioners to the broker, and the MQTT gateway passes it on to Loxone. Since LoxBerry 3 the gateway is part of the system and does not have to be installed separately. No virtual UDP input is needed. <b>The plugin does not send both</b>: if no broker can be reached, the service writes the values via HTTP to virtual inputs of the Miniserver with the same names (fallback path, not built in the sample project)."
SCHRITT2 = "Step 2: subscription in the MQTT gateway"
SCHRITT2_TEXT = "For the MQTT path only. To be entered under <i>System → MQTT Gateway → Subscriptions</i>:"
SCHRITT3 = "Step 3: create virtual inputs"
SCHRITT3_TEXT = "In <b>Loxone Config</b> click the Miniserver, then <i>Virtual Inputs</i>. One input per numeric value (or everything at once with the template below); one <i>Virtual Text Input</i> per text value (unit “Text”), “Use in User Interface” on. <b>The title has to match exactly</b> - the gateway matches by name only."
TITEL_EINGANG = "Title of the virtual input"
UDP_WEG = "<b>No virtual UDP input is needed.</b> Port <b>%s</b> is the <b>command port</b>: Loxone sends the commands there (virtual output, step 4). The values arrive through the MQTT gateway (subscription <span class='sm-mono'>%s/#</span>); if no broker can be reached, the service sends via HTTP to virtual inputs with the names from the table above."
H_VORLAGE = "Create everything at once"
H_VORLAGE_TEXT = "Instead of creating every block by hand, the plugin generates two import files for Loxone Config: one with the <b>virtual inputs</b> and one with the <b>virtual output including every command</b>. Import them in Loxone Config via <i>File → Templates → Import template</i>. <b>What the input template contains and what it does not:</b> the seven text values in the table above get <i>no</i> virtual input - a virtual input carries a number, not text. In exchange the template contains seven additional inputs that do not appear in the table above: four for the sign of life and three for the automation. The command titles are German in every language, as in the sample project (step 6)."
K_VORLAGE = "Create template of the inputs"
K_VORLAGE_AUS = "Create template of the commands"
VORLAGE_WARNUNG = "<b>Note:</b> Loxone Config always creates new objects on import and overwrites nothing. Importing twice yields duplicate blocks, and nobody notices."
SCHRITT4 = "Step 4: commands to the air conditioner"
SCHRITT4_TEXT = "To switch, create a <i>virtual output</i>. Address - %s is the LoxBerry, %s the configured UDP port:"
SCHRITT4_TEXT2 = "Below it add one <i>virtual output command</i> per command. The command text consists of the device number, a <b>space</b> and the command:"
SCHRITT4_TEMP = "<b>Continuous target temperature and target humidity:</b> the command sends <span class='sm-mono'>temp.&lt;v.1&gt;</span> or <span class='sm-mono'>humidity.&lt;v.0&gt;</span>; the connected analogue value sets the temperature (half degrees work, for example <span class='sm-mono'>temp.20.5</span>) or the target humidity in whole percent. Up to 4.5.14 the temperature command carried <span class='sm-mono'>&lt;v&gt;</span> - the service discarded half degrees and single-digit values. Whoever imported the command template earlier changes the command by hand or imports it again."
WAS = "What"
BEFEHL_EIN = "Command for on"
BEFEHL_AUS = "Command for off"
SCHRITT5 = "Step 5: notice when a device fails"
SCHRITT5_TEXT = "When an air conditioner fails, the virtual input keeps its <b>last value</b>. In the app everything then looks normal. That is why there is the value <span class='sm-mono'>online</span>: as long as it reports 1, the device is reachable - it only arrives with a <b>polling interval</b> set (Settings tab, 60 s recommended). The same question applies to the plugin itself - it is answered by the sign of life <span class='sm-mono'>status/zaehler</span>, which counts up every minute; see “Lebenszeichen fehlt (Midea)” on the page “Midea2Lox” in step 6."
SCHRITT6 = "Step 6: three ready-made pages from the sample project"
SCHRITT6_TEXT = "The three pages of the LoxBerry plugins sample project for <b>one</b> air conditioner: “Midea2Lox” (is it running, on/off with window and absence lock, target temperature, automation), “Midea2Lox Betrieb” (operating mode, fan speed, swing, target humidity) and “Midea2Lox Komfort und Energie” (special functions, filter, power and energy). For each page instructions for taking it over, the table, notes and a picture. Working through the table from top to bottom rebuilds the page; the blocks can be found in Loxone Config via the block search (F5). The names of the inputs and commands are shown here with the configured prefix and the number of the first device."
BAUSTEIN_TYP = "Block (type)"
NAME_VORSCHLAG = "Name"
PARAMETER = "Parameters"
EINGAENGE = "Connect inputs to"
SCHRITT7 = "Step 7: verification"
SCHRITT7_TEXT = "After saving in Loxone, click <i>Query the state of all devices</i> in the Test tab. If values appear there, the plugin is sending. If nothing arrives in Loxone anyway, it is either the subscription or the name of a virtual input - both are covered in steps 2 and 3."
