SEITE1_SCHRITT1 = "In the plugin tab “Test” → “Search for devices now”. The air conditioner appears with its number (10 to 19 digits). In the tab “Settings” give the device a name (e.g. “Klima Wohnzimmer”) and set the “Polling interval” to 60, save – without a polling interval “online” and the device values never arrive, and the fault reports after 10 minutes. Tab “Test” → “Query the state of all devices”: values appear."
SEITE1_SCHRITT2 = "MQTT gateway: the plugin brings the subscription “Midea2Lox/#” with it. Tab “Test”, row “Is our topic subscribed in the gateway?” must say “yes”; otherwise enter the subscription under System → MQTT Gateway → Subscriptions."
SEITE1_SCHRITT3 = "Tab “Loxone integration” → “Create template of the inputs” and “Create template of the commands”. In Loxone Config import both files (Periphery → Virtual Inputs or Virtual Outputs → import template), each only ONCE – twice gives duplicate blocks. The two containers “Midea Klimageraete” and “Midea2Lox Befehle” serve all three pages. The command template of the plugin carries the IP address of the LoxBerry (the sample project shows “loxberry” there)."
SEITE1_SCHRITT4 = "Create the page “Midea2Lox”. Drag the 11 commands of the list from “Midea Klimageraete” (no. 1–3, 11–15, 26–28) and the two commands no. 22 and 24 from “Midea2Lox Befehle”; plus “Konstante 1” and “Niemand zu Hause (eigene Quelle)” if already in the project (otherwise create them as a constant or a switch). Create new (Periphery → Virtual Inputs): switch “Klima ein (Midea)”, switch “Fenster offen (eigene Quelle)”, slider “Solltemperatur (Midea)” (16–30, step 0.5); Virtual Text Input “Midea2Lox_automatik_grund” – name exactly like this."
SEITE1_SCHRITT5 = "Create the notification “Meldung Plugin gestört (Midea)” (Periphery → Messages → Notification), text as in the list. It gets exactly one connection (from no. 8)."
SEITE1_SCHRITT6 = "Add the remaining blocks via the block search (F5), parameters as in the list, connect from top to bottom. Value Validator no. 5: remove the tick at ‘En’ in the properties window (Config creates En inverted; otherwise the constant 1 arrives as 0). AND no. 20: invert both inputs – click the input point, the input then shows a small circle. Status “Klima (Midea)”: click “+” three times first; rows in the given order, the one without condition last. Switch on “Statistics” at input no. 12 (room temperature)."
SEITE1_SCHRITT7 = "Save and transfer. Check: “Zustand (Midea)” shows “läuft – Klimagerät erreichbar” (running); Midea2Lox_status_zaehler counts up every minute; the switch “Klima ein (Midea)” switches the device within a few seconds."
SEITE1_H1 = "<b>On no. 1 and 5:</b> if the LoxBerry, the MQTT gateway or the service stops, all inputs keep their last value – only the stopped counter <span class='sm-mono'>Midea2Lox_status_zaehler</span> gives it away. If no new value arrives within Tmc (300 s), the value validator reports at its output E. Remove the tick at ‘En’ in the properties window."
SEITE1_H2 = "<b>On no. 3 and 6 to 9:</b> “online” only arrives with a polling interval (step 1). The message “Plugin gestört” comes after about 10 minutes if the device does not answer, and after about 15 minutes (5 minutes sign of life plus 10 minutes) if the plugin stops. A notification gets only one source – both faults go through the OR no. 7."
SEITE1_H3 = "<b>On no. 17 to 21:</b> both inputs of the AND no. 20 are inverted. The device goes off after 1 minute of an open window or at once when nobody is at home, and on again as soon as both are over and the switch is on. The plugin can also handle the window itself (tab Automation, “Window open: device off”, via Matter2Lox) – there it does NOT switch on again. Choose only one of the two ways in your own home."
SEITE1_H4 = "In your own project every name carries your own device number instead of 123456789012 – the templates and this table bring it along correctly."
SEITE1_H5 = "Every command from Loxone suspends the automation of the plugin for the lock time (120 minutes by default) – “manual priority”. A poll does not. The automation values (no. 26–30) only arrive when the automation is switched on in the plugin; otherwise they stay 0."
SEITE1_H6 = "Several air conditioners: the same device blocks for each device with its number; lead the faults through further OR blocks (two inputs each) in front of no. 8 – never several sources directly to the notification."
SEITE1_H7 = "The commands go to the LoxBerry via UDP; the plugin only accepts them from your own Miniserver. Since 4.5.15 the target temperature command sends <span class='sm-mono'>temp.&lt;v.1&gt;</span> – half degrees work."
SEITE1_H8 = "Whoever uses the Loxone air conditioner controller or the Intelligent Room Controller connects its setpoint to “Solltemperatur stufenlos” (no. 24) and its on/off to “Ein- und ausschalten” (no. 22) – not part of the sample project."
SEITE1_H9 = "Deliberately not in the sample project: <span class='sm-mono'>status/ts</span>, <span class='sm-mono'>status/dienst</span> (the counter tells it more reliably), <span class='sm-mono'>connection/status</span>, iECO, swing angles, fan speeds as a number, <span class='sm-mono'>rate_select</span>, <span class='sm-mono'>breeze_mode</span> and the HTTP fallback path without a broker."
SEITE2_SCHRITT1 = "Containers from the page “Midea2Lox”, step 3 (do not import them again)."
SEITE2_SCHRITT2 = "New page “Midea2Lox Betrieb”, drag the 18 commands of the list (17 from “Midea2Lox Befehle”, no. 21 from “Midea Klimageraete”). Create new: slider “Sollfeuchte (Midea)” (35–70, step 5), push button “Jetzt abfragen (Midea)”, three Virtual Text Inputs with the names of no. 22–24 exactly like this, “Use in User Interface” on."
SEITE2_SCHRITT3 = "Three Radio Buttons via F5: number of buttons and button texts as in the list, untick remanence. Output Q1, Q2, Q3 … of the Radio Buttons to the command of the same row (Q1 to the first command below it, and so on)."
SEITE2_SCHRITT4 = "Place the status “Betrieb (Midea)”, connect it. Save and transfer. Check: select “Kühlen” in the app – after the next poll (at most 1 minute, or “Jetzt abfragen”) the text input shows “operational_mode_enum.cool”."
SEITE2_H1 = "The Radio Buttons show what was last selected in the app; what the device really does (also after the remote control) is shown by the text inputs no. 22–24."
SEITE2_H2 = "<b>On no. 1, 7 and 14:</b> remanence off – otherwise the Miniserver sends the last selected button again after a restart, and every command sets the manual priority of the automation."
SEITE2_H3 = "In the operating mode automatic the device sets the fan speed itself; the plugin resets any other speed to automatic."
SEITE2_H4 = "The target humidity only acts on devices with humidity control (dehumidify); others skip the command, the log says so. The command “Sollfeuchte stufenlos” is new in 4.5.15 – whoever imported the command template earlier creates it by hand or imports again."
SEITE3_SCHRITT1 = "Containers as above. New page “Midea2Lox Komfort und Energie”, drag the 21 commands (9 from “Midea2Lox Befehle”, 12 from “Midea Klimageraete”); switch on “Statistics” at power (no. 30) and total energy (no. 31)."
SEITE3_SCHRITT2 = "Create new: seven switches, two push buttons (names as in the list), notification “Meldung Filter reinigen (Midea)”."
SEITE3_SCHRITT3 = "Status blocks via F5; click “+” four times at “Komfort (Midea)” first. Save and transfer. Check: switch “Sparbetrieb (Midea)” on – after the next poll “Komfort (Midea)” shows “Spar 1”."
SEITE3_H1 = "Not every device can do every function; what it cannot do the plugin skips with a warning in the log, the value stays 0."
SEITE3_H2 = "Freeze protection sets the device to heating."
SEITE3_H3 = "<b>On no. 28 and 29:</b> the filter message comes again after every transfer as long as the device reports “clean filter” – clean the filter, reset it at the device."
SEITE3_H4 = "Not all devices supply power and energy; then 0 stands there."

