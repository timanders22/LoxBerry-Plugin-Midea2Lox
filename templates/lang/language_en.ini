SEITE1_SCHRITT1 = "In the plugin tab “Test” → “Search for devices now”. The air conditioner appears with its number (10 to 19 digits). In the tab “Settings” give the device a name (e.g. “Klima Wohnzimmer”) and set the “Polling interval” to 60, save – without a polling interval “online” and the device values never arrive, and the fault reports after 10 minutes. Tab “Test” → “Query the state of all devices”: values appear."
SEITE1_SCHRITT2 = "In the plugin tab “MQTT” set the ticks “Accept commands via MQTT” and “Allow on/off, operating mode, freeze protection and self-cleaning via MQTT” and save (both off by default). MQTT gateway version 1: the plugin brings the subscription “Midea2Lox/#” (tab “Test”, row “Is our topic subscribed in the gateway?”). Version 2: tick the topics of the name table marked “V2”, status/ok and online additionally “Noncached”; do not tick befehl/…."
SEITE1_SCHRITT3 = "In Loxone Config under Periphery → Virtual Inputs create the Virtual Inputs of the list – name exactly as in the name table of the plugin (tab “Loxone integration”, copy button), do NOT tick “Use as digital input”; the texts (automatik_grund, operating mode, fan, swing, power level) as Virtual Text Input. The LoxBerry user needs rights in the Miniserver. The commands go into the Virtual Output “LoxBerry MQTT-Gateway” (template VQ_loxberry_mqtt_gateway.xml from the sample project) or all at once with the template “MQTT commands” of the plugin."
SEITE1_SCHRITT4 = "Create the page “Midea2Lox”. Drag the 12 inputs of the list (no. 1–3, 11–15, 26–28, 31) and the two commands no. 22 and 24; also “Konstante 1” and “Niemand zu Hause (eigene Quelle)” if already in the project (otherwise new as constant or switch). Create new (Periphery → Virtual Inputs): switch “Klima ein (Midea)”, switch “Fenster offen (eigene Quelle)”, slider “Solltemperatur (Midea)” (16–30, step 0.5); Virtual Text Input “Midea2Lox_automatik_grund” – name exactly like this."
SEITE1_SCHRITT5 = "Create the notification “Meldung Plugin gestört (Midea)” (Periphery → Messages → Notification), text as in the list. It gets exactly one connection (from no. 8)."
SEITE1_SCHRITT6 = "Remaining blocks via the block search (F5), parameters as in the list, connect from top to bottom. Value validator no. 5: remove the tick at ‘En’ in the properties window (Config creates En negated; otherwise the constant 1 arrives as 0). AND no. 20: negate both inputs – click on the input point, afterwards the input shows a small circle. Status “Klima (Midea)”: press “+” three times first; rows in the given order, the one without condition last. Switch on “Statistics” at input no. 12 (room temperature)."
SEITE1_SCHRITT7 = "Save and transfer. Check: “Zustand (Midea)” shows “running – air conditioner reachable”; Midea2Lox_status_zaehler counts up every minute; the switch “Klima ein (Midea)” switches the device within a few seconds (the plugin tab “Test” shows the acknowledgement “angenommen”)."
SEITE1_H1 = "<b>On no. 1 and 5:</b> if the LoxBerry, the MQTT gateway or the service stops, all inputs keep their last value – only the stopped counter <span class='sm-mono'>Midea2Lox_status_zaehler</span> gives it away. If no new value arrives within Tmc (300 s), the value validator reports at its output E. Remove the tick at ‘En’ in the properties window."
SEITE1_H2 = "<b>On no. 3 and 6 to 9:</b> “online” arrives only with a polling interval (step 1). The notification “Plugin gestört” comes after about 10 minutes when the device does not answer, and after about 15 minutes (5 minutes sign of life and 10 minutes) when the plugin stands still. A notification gets only one source – both faults run via the OR no. 7."
SEITE1_H3 = "<b>On no. 17 to 21:</b> both inputs of the AND no. 20 are negated. The device goes off after 1 minute of open window or immediately at “nobody at home” and on again as soon as both are over and the switch is on. The plugin can do both itself (tab Automation: “Window open: device off” via haus/tuer/…, “Consider presence” via haus/anwesenheit/jemand) – there it does NOT switch on again. In your own house choose only one of the two ways per task."
SEITE1_H4 = "In your own project every name and every command carries your own device number instead of 123456789012 – the name table and the template MQTT commands of the plugin bring that correctly."
SEITE1_H5 = "Every command from Loxone suspends the automation of the plugin for the lock time (120 minutes by default) – “manual priority” – and ends the away mode of the device. A query does not. The automation values (no. 26–30) arrive only when the automation is switched on in the plugin; otherwise they stay 0."
SEITE1_H6 = "Several air conditioners: for each device the same device blocks with its number; route the faults via further ORs (two inputs each) before no. 8 – never several sources directly to the notification."
SEITE1_H7 = "The commands go as <span class='sm-mono'>publish Midea2Lox/befehl/&lt;number&gt;/&lt;name&gt;</span> via the UDP input of the MQTT gateway; anyone in the home network can send there – that is why both ticks in the plugin are off by default. Never “retain”: a retained command is discarded. The plugin acknowledges under …/quittung (visible in the tab Test). Default values: -1 = no statement, -999 = temperature missing."
SEITE1_H8 = "Whoever uses the Loxone air conditioner controller or the Intelligent Room Controller connects its target value to “Midea2Lox: Solltemperatur” (no. 24) and its on/off to “Midea2Lox: Ein- und ausschalten” (no. 22) – not part of the sample project."
SEITE1_H9 = "Deliberately not in the sample project: <span class='sm-mono'>status/ts</span>, <span class='sm-mono'>status/dienst</span> (the counter tells it more reliably), <span class='sm-mono'>status/befehle</span> and the acknowledgements (tab Test), <span class='sm-mono'>connection/status</span>, iECO, swing angles, fan speeds as a number, <span class='sm-mono'>breeze_mode</span>, the power levels LEVEL_1–5 and the HTTP fallback without broker."
SEITE2_SCHRITT1 = "Inputs and commands as on page “Midea2Lox” (name table, Virtual Output “LoxBerry MQTT-Gateway”)."
SEITE2_SCHRITT2 = "New page “Midea2Lox Betrieb”, drag the 17 commands and the input no. 21 of the list. Create new: slider “Sollfeuchte (Midea)” (35–70, step 5), push button “Jetzt abfragen (Midea)”, three Virtual Text Inputs with the names no. 22–24 exactly like this, “Use in User Interface” on."
SEITE2_SCHRITT3 = "Three radio buttons via F5: number of buttons and button texts as in the list, untick remanence. Output Q1, Q2, Q3 … of the radio buttons to the command of the same row (Q1 to the first command below and so on)."
SEITE2_SCHRITT4 = "Place status “Betrieb (Midea)”, connect the three text inputs to V4–V6. Save and transfer. Check: select “Kühlen” in the app – after the next query (at most 1 minute, or “Jetzt abfragen”) the status shows “Kühlen gewählt – das Gerät meldet operational_mode_enum.cool …”."
SEITE2_H1 = "The radio buttons show what was last selected from the app; what the device really does (also after the remote control) is shown by the text inputs no. 22–24 in status no. 27."
SEITE2_H2 = "<b>On no. 1, 7 and 14:</b> remanence off – otherwise the Miniserver sends the last selected button again after a restart, and every command sets the manual priority of the automation."
SEITE2_H3 = "In the operating mode automatic the device sets the fan speed itself; the plugin resets another speed to automatic. The operating mode needs both ticks in the plugin (tab MQTT)."
SEITE2_H4 = "The target humidity works only for devices with humidity control (dehumidify); others ignore the command, the acknowledgement then reads “abgelehnt: KANN_DAS_GERAET_NICHT”."
SEITE3_SCHRITT1 = "New page “Midea2Lox Komfort und Energie”, drag the 12 commands and 12 inputs of the list; switch on “Statistics” at power (no. 30) and total energy (no. 31)."
SEITE3_SCHRITT2 = "Create new: seven switches, two push buttons (names as in the list), formula no. 34, radio buttons no. 35, Virtual Text Input no. 39 (name exactly like this), notification “Meldung Filter reinigen (Midea)” at formula no. 34."
SEITE3_SCHRITT3 = "Status via F5; “Komfort (Midea)” press “+” four times first. Save and transfer. Check: “Sparbetrieb (Midea)” on – after the next query “Komfort (Midea)” shows “Spar 1”."
SEITE3_H1 = "Not every device can do every function; what it cannot do, the plugin ignores with a warning in the log and the acknowledgement “abgelehnt: KANN_DAS_GERAET_NICHT”; if the device does not report a state, -1 is shown."
SEITE3_H2 = "Freeze protection sets the device to heating; freeze protection and self-cleaning need both ticks in the plugin (tab MQTT)."
SEITE3_H3 = "<b>On no. 28, 34 and 29:</b> the formula lets only 1 pass – -1 (the device does not report it) triggers no notification. The filter notification comes again after every transfer as long as the device reports “clean filter” – clean the filter, reset at the device."
SEITE3_H4 = "Power and energy are not supplied by all devices; then -1 is shown."
Z1_31 = "Virtual Input (name as assigned by the MQTT gateway, plugin Midea2Lox) | Midea2Lox_anwesenheit_aktiv | 1 = away mode: the plugin holds air conditioners because of “nobody at home” (haus/anwesenheit/jemand, tab Automation “Consider presence”, off by default), 0 = not, -1 = switched on, but the source is silent; never retained; gateway version 2: tick | —"
Z3_34 = "Formula | Filter reinigen gemeldet (Midea) | IF(I1>0;1;0) – only 1 triggers the notification, -1 (the device does not report it) does not | I1 = #28"
Z3_35 = "Radio Buttons | Leistungsbegrenzung (Midea) | Button 1 “aus”, button 2 “50 Prozent”, button 3 “75 Prozent”; text for “no button selected”: “wie am Gerät”; remanence off; only devices that can do it (in the plugin log in the capability list under supported_rate_selects) – e.g. to cool economically with little PV surplus | —"
Z3_36 = "Virtual Output Command (template “LoxBerry MQTT-Gateway”, MQTT) | Midea2Lox: Leistungsbegrenzung aus | Command for ON: publish Midea2Lox/befehl/123456789012/leistungsstufe aus (never retain); full power; ticks as no. 2 | Input = output Q1 of #35"
Z3_37 = "Virtual Output Command (template “LoxBerry MQTT-Gateway”, MQTT) | Midea2Lox: Leistungsbegrenzung 50 Prozent | Command for ON: publish Midea2Lox/befehl/123456789012/leistungsstufe gear_50 (never retain); power limited to about half; ticks as no. 2 | Input = output Q2 of #35"
Z3_38 = "Virtual Output Command (template “LoxBerry MQTT-Gateway”, MQTT) | Midea2Lox: Leistungsbegrenzung 75 Prozent | Command for ON: publish Midea2Lox/befehl/123456789012/leistungsstufe gear_75 (never retain); power limited to about three quarters; ticks as no. 2 | Input = output Q3 of #35"
Z3_39 = "Virtual Text Input | Midea2Lox_123456789012_rate_select | create by hand, name exactly like this (the name the MQTT gateway assigns), “Use in User Interface” on; power level as the device reports it: “OFF”, “GEAR_50”, “GEAR_75” (other devices “LEVEL_1” to “LEVEL_5”), “-” = the device cannot do it; retained; gateway version 2: tick | —"
Z3_40 = "Status | Leistung (Midea) | Rows: V1 = 2 “limited to 50 per cent selected – the device reports <v2>”; V1 = 3 “limited to 75 per cent selected – the device reports <v2>”; V1 = 1 “no limit selected – the device reports <v2>”; without condition “nothing selected in the app – the device reports <v2> (“-” = cannot do it)”; visualisation ON | V1 = #35, V2 = #39"
SEITE3_H5 = "<b>On no. 35 to 40:</b> power limitation only for devices that report it (capability list in the plugin log, supported_rate_selects); others acknowledge “abgelehnt: KANN_DAS_GERAET_NICHT”, and the text input no. 39 shows “-”. The levels LEVEL_1–5 are only in the templates of the plugin."

