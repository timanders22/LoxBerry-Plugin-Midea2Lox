RETAIN_ERKLAERUNG = "<b>Retained</b> means the broker keeps the last value, so Loxone has it again right after a restart. That is right for <i>device states</i> and wrong for <i>measured values</i> - an old reading would look like a current one. Whatever the service says about itself is never retained either: the <i>heartbeat</i> (it would keep reporting „alive“ long after the service has died), the reachability <i>online</i> (the service determines it from its own query) and the <i>automation</i> topics. <i>connection/status</i>, on the other hand, is retained: „connected“ on connecting, „disconnected“ as the last will that the broker sets by itself; uninstalling clears the topic."
