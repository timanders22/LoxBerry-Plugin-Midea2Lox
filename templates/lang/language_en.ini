GRUPPE_STATUS = "Heartbeat of the plugin"
STATUS_ERKLAERUNG = "These topics apply to the plugin, not to a single device. They answer the question a virtual input cannot answer by itself: <b>is the value current, or has it been standing still since the failure?</b> A virtual input keeps its last value, with retain even across a restart of the Miniserver - without a sign of life a dead service looks like a quiet one in the app."
THEMEN_OHNE_GERAETE = "As soon as devices are configured, topics follow the pattern <span class='sm-mono'>%s/&lt;device number&gt;/&lt;value&gt;</span>."
MQTT_REGELWEG = "MQTT is the standard path."
UDP_AUSWEICHWEG = "If no broker can be reached, the service sends via HTTP to virtual inputs of the Miniserver - with the names from the Loxone integration tab (underscore instead of slash)."
H_EINBINDUNG = "Loxone integration, step by step"
EINBINDUNG_EINLEITUNG = "The sample project reads the values via the MQTT gateway into plain <b>Virtual Inputs</b> and sends commands to the plugin via <b>MQTT</b> (tick “Accept commands via MQTT” in the tab MQTT). There is no template with Virtual HTTP Inputs any more. The UDP command input (port %s) stays for existing installations; its template is collapsed below."
EINBINDUNG_OHNE_GERAETE = "<b>No devices are configured yet.</b> The examples below therefore use the placeholder number %s. Please run a device search in the Test tab first - afterwards the real numbers appear here."
SCHRITT1 = "Step 1: the path of the values – MQTT"
SCHRITT1_TEXT = "<b>MQTT</b> is the way: the service reports the state of the air conditioners to the broker, the MQTT gateway passes it on to Loxone, and commands come back via MQTT. The gateway has been part of the system since LoxBerry 3 and does not need to be installed. <b>The plugin does not send both</b>: if no broker can be reached, the service writes the values via HTTP to virtual inputs of the Miniserver with the same names (fallback, not built in the sample project)."
SCHRITT2 = "Step 2: subscription in the MQTT gateway"
SCHRITT2_TEXT = "Version 1 of the MQTT gateway: the plugin brings the subscription (config/mqtt_subscriptions.cfg). Version 2: tick the topics marked “V2” in the name table (step 3), status/ok and online additionally “Noncached”."
SCHRITT3 = "Step 3: create virtual inputs"
SCHRITT3_TEXT = "In <b>Loxone Config</b> under <i>Virtual Inputs</i> create one <b>Virtual Input</b> per number with exactly the name from the table, do not tick “Use as digital input”; per text a <i>Virtual Text Input</i>, “Use in User Interface” on. <b>The name must match exactly</b> – the gateway assigns solely by name. The LoxBerry user needs rights in the Miniserver."
UDP_WEG = "Port <b>%s</b> is the <b>UDP command port</b> of the service (sender filter: only the Miniservers and the LoxBerry itself). The values always arrive via the MQTT gateway (subscription <span class='sm-mono'>%s/#</span>); no virtual UDP input is needed."
K_VORLAGE_AUS = "Template output (UDP)"
VORLAGE_WARNUNG = "<b>Note:</b> Loxone Config always creates new objects on import and overwrites nothing. Importing twice yields duplicate blocks, and nobody notices."
SCHRITT4 = "Step 4: commands to the air conditioner"
SCHRITT4_TEXT = "To switch, create a <i>virtual output</i>. Address - %s is the LoxBerry, %s the configured UDP port:"
SCHRITT4_TEXT2 = "Below it add one <i>virtual output command</i> per command. The command text consists of the device number, a <b>space</b> and the command:"
SCHRITT4_TEMP = "<b>Continuous target temperature and target humidity:</b> the command sends <span class='sm-mono'>temp.&lt;v.1&gt;</span> or <span class='sm-mono'>humidity.&lt;v.0&gt;</span>; the connected analogue value sets the temperature (half degrees work, for example <span class='sm-mono'>temp.20.5</span>) or the target humidity in whole percent. Up to 4.5.14 the temperature command carried <span class='sm-mono'>&lt;v&gt;</span> - the service discarded half degrees and single-digit values. Whoever imported the command template earlier changes the command by hand or imports it again."
WAS = "What"
BEFEHL_EIN = "Command for on"
BEFEHL_AUS = "Command for off"
SCHRITT5 = "Step 5: failure detection"
SCHRITT5_TEXT = "If something fails, a Virtual Input keeps its <b>last value</b>. For the plugin the sign of life <span class='sm-mono'>status_zaehler</span> counts up every minute – a value validator (Tmc 300 s, five heartbeats) reports when it stops. For the device there is <span class='sm-mono'>online</span> (only with a polling interval, tab Settings 60 s); <span class='sm-mono'>status_ok</span> and <span class='sm-mono'>online</span> as “Noncached” under gateway V2. Do not use <span class='sm-mono'>status_ts</span> (local time). See “Lebenszeichen fehlt (Midea)” on page “Midea2Lox” in step 6."
SCHRITT6 = "Step 6: three ready-made pages from the sample project"
SCHRITT6_TEXT = "The three pages of the LoxBerry plugins sample project for <b>one</b> air conditioner: “Midea2Lox” (is it running, on/off with window and absence lock, target temperature, automation), “Midea2Lox Betrieb” (operating mode, fan speed, swing, target humidity) and “Midea2Lox Komfort und Energie” (special functions, filter, power and energy). For each page instructions for taking it over, the table, notes and a picture. Working through the table from top to bottom rebuilds the page; the blocks can be found in Loxone Config via the block search (F5). The names of the inputs and commands are shown here with the configured prefix and the number of the first device."
BAUSTEIN_TYP = "Block (type)"
NAME_VORSCHLAG = "Name"
PARAMETER = "Parameters"
EINGAENGE = "Connect inputs to"
SCHRITT7 = "Step 7: verification"
SCHRITT7_TEXT = "After saving in Loxone, click <i>Query the state of all devices</i> in the Test tab. If values appear there, the plugin is sending. If nothing arrives in Loxone anyway, it is either the subscription or the name of a virtual input - both are covered in steps 2 and 3."
