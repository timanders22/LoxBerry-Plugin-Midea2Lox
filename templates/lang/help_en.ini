; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Midea2Lox"
K02 = "Integration of air conditioners of the Midea group into Loxone — as a LoxBerry plugin."
K03 = "<b>Fork note:</b> This repository continues the work of <b>Harald Friedl</b> (<code>seppe912</code>). He explicitly released it for further development in <a href='https://github.com/seppe912/Midea2Lox/issues/15' target='_blank'>issue #15</a> because he no longer runs a LoxBerry himself. His code is the basis, the licence (Apache 2.0) stays unchanged. What has changed since 3.4.8 is in the release notes from 4.0.0 onwards."
K04 = "What the plugin does"
K05 = "A UDP service runs on the LoxBerry. It receives commands from the Miniserver and sends them to the air conditioners on the local network — <b>without a detour through the manufacturer's cloud</b>. In the other direction it reports their state back: through the MQTT gateway and, if no broker can be reached, via HTTP to virtual inputs of the Miniserver."
K06 = "The credentials of the manufacturer account are needed <b>only for the device search</b>, to fetch token and key for protocol V3 devices; afterwards everything runs on the local network. <b>It also works without your own account</b> — msmart-ng then uses its shared accounts, and that is usually enough. Your own account helps when the search returns no token for a V3 device. Up to 4.2.12 the fields were not evaluated at all; since 4.3.0 they are really passed on."
K07 = "Installation"
K08 = "Install the archive in the LoxBerry plugin manager."
K09 = "<b>Settings</b> tab: enter the Miniserver, the UDP port and the credentials of the Midea account, choose the region."
K10 = "<b>Save and search for devices</b> — that takes up to a minute."
K11 = "<b>Test</b> tab: look at the self-check. Only once there is no <b>cross</b> left is it worth moving on to Loxone. A <b>dash</b> is not a cross - it only means the question could not be measured here."
K12 = "<b>Loxone integration</b> tab: step by step, with three ready-made pages from the LoxBerry plugins sample project (state and on/off, operation, comfort and energy) – for each page instructions for taking it over, the block table, notes and a picture."
K13 = "Prerequisites"
K14 = "LoxBerry 4 recommended (LoxBerry 3 on Debian 12 works as well)"
K15 = "<b>Python ≥ 3.10</b> — <code>preroot.sh</code> checks this and otherwise aborts with a message. Older LoxBerry installations grown over the years sometimes still carry Python 3.7 or 3.9; there only a current image helps."
K16 = "<b>No additional plugin.</b> The MQTT gateway has been part of the system since LoxBerry 3 (<code>webfrontend/htmlauth/system/mqtt.cgi</code>, reachable under <i>System → MQTT Gateway</i> or <code>/admin/system/mqtt.cgi</code>). In the default configuration the broker is set to <code>localhost:1883</code> and the gateway starts automatically."
K17 = "The Python modules are installed into a <b>virtual environment of their own</b> under <code>bin/plugins/Midea2Lox/venv</code>. The system Python stays untouched — and PEP 668, which makes system-wide pip installs fail on Debian 12/13, does not come into play."
K18 = "Supported devices"
K19 = "Air conditioners of the Midea group and its trade brands (Comfee, Kaisai, Senville, Pioneer, Qlima, Rotenso, Inventor and many more). The actual work is done by <a href='https://github.com/mill1000/midea-msmart' target='_blank'>msmart-ng</a> by mill1000 — which is also where the list of known devices is."
K20 = "Original README (as of 3.4.8)"
K21 = "Midea2Lox"
K22 = "Integration of Midea group air conditioners into Loxone. ----- not tested with Loxone, but the following manufacturers may work ---- Custom Integration for Midea Group (Ariston, Hualing, Senville, Klimaire, Kaysun, AirCon, Century, Pridiom, Thermocore, Comfee, Alpine Home Air, Artel, Beko, Electrolux, Galactic, Idea, Inventor, Kaisai, Mitsui, Mr. Cool, Neoclima, Olimpia Splendid, Pioneer, QLIMA, Royal Clima, Qzen, Toshiba, Carrier, Goodman, Friedrich, Samsung, Kenmore, Trane, Lennox, LG and much more) Air Conditioners via LAN. ----- not tested ----"
K23 = "This LoxBerry plugin enables communication between the LoxBerry/Loxone and Midea air conditioners."
K24 = "The main part, the Python 3 Midea script, originally comes from NeoAcheron https://github.com/NeoAcheron/midea-ac-py (cloud version up to Midea2Lox 1.1). Many thanks for that; without it this plugin would not have worked. For control over LAN (from Midea2Lox V2.0) mac_zhou did outstanding work with msmart https://github.com/mac-zhou/midea-msmart. Thanks for that! (Thanks mac-zhou!) msmart is now developed further by mill1000 --&gt; https://github.com/mill1000/midea-msmart"
K25 = "Installation:"
K26 = "Download the plugin and install it in the LoxBerry plugin manager. Then enter the receiving port you want; after that the service can be started with start."
K27 = "The plugin handles the communication between Midea and the LoxBerry. A UDP server runs on the LoxBerry which forwards incoming commands to Midea. The current state is output and switched directly through the virtual inputs of the LoxBerry, so the inputs in Loxone have to carry exactly the wording used in the example configuration. The example configuration for Loxone can also be found here."
K28 = "More information is available at https://www.loxwiki.eu/display/LOXBERRY/Midea2Lox"
K29 = "From Midea2Lox V2.0 onwards the communication runs directly over LAN, without the cloud."
K30 = "Midea 8370 protocol / V3, for example EU-OSK103"
K31 = "From Midea2Lox V3.0 onwards the newer sticks with protocol version 3 are supported over LAN."
K32 = "What 4.3.0 brings"
K33 = "A <b>polling interval</b>: the plugin fetches the values on its own, without Loxone having to send anything. It is <b>off by default (0)</b> — if you already built the cycle in Loxone, every device would otherwise be polled twice. Lower limit 30 seconds."
K34 = "A <b>heartbeat</b> under <code>&lt;prefix&gt;/status/…</code>. A virtual input keeps its last value — without a heartbeat a dead service looks exactly like a quiet one in the app. The timestamp goes out on every cycle; the Miniserver computes the age itself (Loxone time plus 1230768000 minus timestamp)."
K35 = "<b>Back up and restore</b> via two buttons in the Settings tab. The file contains all settings <b>and the discovered devices including token and key</b> — restored on a second LoxBerry the plugin works immediately, without a new device search."
K36 = "<b>Note:</b> the file therefore carries a secret. Anyone who has it can control the air conditioners on the same network. Treat it like a password: do not post it in a forum and do not attach it to a bug report."
K37 = "<b>Two Loxone templates</b> instead of one: one for the virtual inputs and one for the virtual output including every command. Loxone Config always creates new objects on import and overwrites nothing — importing twice yields duplicate blocks."
K38 = "The <b>topic list is complete</b>: 28 values per device instead of 7, grouped into basic values, comfort and energy. The three energy values were not documented anywhere up to 4.2.12."
K39 = "<b>Switching from the Test tab</b>, with a dry run. The command travels the same path as a command from Loxone — what works here works there."
K40 = "What you should know"
K41 = "The plugin maps the <b>region</b> to one of the three server areas msmart-ng knows (DE, KR, US); all European countries go through DE. Without a setting msmart-ng would use its default US — the wrong server for a European account. If your configuration still holds a region that no longer exists, the plugin says so and changes nothing on its own."
K42 = "The <b>energy values</b> have not been verified against a device. msmart-ng itself notes that many devices report them without claiming support. Before you feed them into Loxone as a meter reading, compare them once with what the device or an inline meter shows — a number that looks right is worse than no number."
K43 = "The <b>Test</b> tab answers line by line whether the setup holds — without you having to go to Loxone. A <b>dash</b> there is explicitly not a tick: it means the question could not be measured."
K50 = "The <b>Automation</b> tab"
K51 = "The automation shifts the target temperature when electricity happens to be cheap or your own system delivers more than the house needs. It does <b>not</b> fetch the prices itself — the spot price plugins already do that, and the surplus is known to the feed-in brake. Midea2Lox only listens to their MQTT topics."
K52 = "The direction follows the operating mode: when <b>cooling</b> the target is lowered, when <b>heating</b> it is raised. In modes without a target nothing happens."
K53 = "<b>The automation only undoes what it did itself.</b> A device you had switched on it will not switch off. Any command from Loxone or from the Test tab suspends it for the configured lockout time — a plain status query does not. It puts the target back but <b>does not switch</b>: otherwise a device you had just switched on would go off."
K54 = "If a signal stays away longer than the configured maximum age it counts as absent, and the automation restores the state it found. Whether anything arrives at all is shown in the <b>Test</b> tab: look there before switching the automation on."
K55 = "Window open: device off"
K56 = "In the <b>Automation</b> tab, <b>off by default</b>. When switched on, the plugin listens to the house topics <code>haus/tuer/&lt;name&gt;/offen</code> (0 = closed, 1 = open, <code>-</code> = no statement). They come from <b>Matter2Lox</b> when its house topics are switched on; every contact sensor counts as a door there, so a window contact does too. The shading plugin Fensterbilanz does not provide such a topic. For each device you enter a list of windows: <code>&lt;device number&gt;:&lt;name&gt;+&lt;name&gt;</code>, several devices separated by commas."
K57 = "If an assigned window stays open longer than the delay (default 60 s, adjustable from 0 to 600), the device gets <b>one</b> off command - one per opening, even if further windows open. <b>When the window closes, the device is not switched back on.</b> While a window is open, the automation does not act on this device."
K58 = "A value that only comes from the broker memory at start-up or after a reconnect triggers nothing - only a freshly sent opening does. If the source is silent or reports <code>-</code>, nothing happens, and the <b>Test</b> tab says so for each window."
K59 = "Same command within 60 s"
K60 = "If Loxone sends the same set value to the same device again within 60 s (on/off, temperature, mode, fan, swing, eco, turbo and the other on/off switches, humidity, angle, rate), it is not sent to the device again; the log says <code>UNVERAENDERT=1</code>. A different value goes out at once. <code>toggle_Display</code>, <code>toggle_self_clean</code>, <code>status</code> and the <b>Send</b> button in the <b>Test</b> tab always act. If the automation, the window coupling or - visible in a status query - the remote control sets the device differently, the next command counts as new again."
K61 = "Commands via MQTT, default values and presence (since 4.5.18)"
K62 = "<b>Commands via MQTT</b> (tab MQTT, <b>off by default</b>): with the tick “Accept commands via MQTT” the service subscribes to <code>&lt;prefix&gt;/befehl/&lt;device number&gt;/&lt;name&gt;</code> and queues every command in the same queue as a UDP command – the same value within 60 s is not sent again, every command except “abfragen” sets the manual priority of the automation. 17 names: ein, betriebsart, luefter, schwenken, soll, feuchte, spar, schnell, nacht, fernbedienung, frostschutz, luftreinigung, ton, anzeige, selbstreinigung, abfragen, leistungsstufe. On/off, operating mode, freeze protection and self-cleaning need the second tick. Anyone in the home network can send via the UDP input of the MQTT gateway – that is why both ticks are off by default."
K63 = "The plugin acknowledges under <code>…/quittung</code> after talking to the device: “angenommen” or “abgelehnt: …” (GERAET_ANTWORTET_NICHT, KANN_DAS_GERAET_NICHT, AUSSERHALB_GERAETEBEREICH, wiederholt (vor n s), GERAET_UNBEKANNT, unbekannter Befehl, Wert ungueltig, zweiter Haken aus). Never send “retain”: a retained command is discarded. Under MQTT 3.1.1 a command sent live with “retain” acts once; every later delivery from the broker memory (after restart or reconnect) is discarded."
K64 = "<b>Default values:</b> what a successful query does not deliver arrives as <code>-1</code> (temperatures <code>-999</code>, texts still “-”) – no longer as “-”, which a Virtual Input reads as 0. An offline device reports only <code>online = 0</code>; its states stay. <code>rate_select</code> and <code>breeze_mode</code> are only sent with the capability, otherwise once “-”. Checks in Loxone for “= 0” will see -1 or -999 from now on."
K65 = "<b>Presence</b> (tab Automation, <b>off by default</b>): the plugin listens to <code>haus/anwesenheit/jemand</code> (e.g. from BLE-Scanner NG from 1.3.28). If the source sends 0 live and it stays so for the delay (default 300 s), it shifts the target value of the switched-on devices once per absence by 3.0 K in the economical direction (optionally eco mode or switching off). On 1 it restores only what it changed itself and never switches on. If <code>haus/anwesenheit/zaehler</code> does not change for more than 120 s or “-” arrives, it restores as well and does nothing else; the tab Test says so. It writes nothing under <code>haus/</code>."
K66 = "The UDP command input stays for existing installations and now listens on all addresses (protection is the sender filter: only the Miniservers and the LoxBerry itself); the button “Send” in the tab Test sends to 127.0.0.1. The template with Virtual HTTP Inputs has been dropped – the names are in the name table in the tab Loxone integration."
K67 = "Pre-cool with solar power (since 4.5.22)"
K68 = "In the <b>Automation</b> tab one switch per device, <b>off by default</b>. Switched on, the air conditioner cools with power your solar system is currently feeding into the grid. Example: it is 1 pm and the system has been feeding in more than 800 W for 10 minutes – the plugin switches the device on and sets cooling and 23 °C. If the house then draws more than 200 W from the grid for 5 minutes, it switches the device off again, after 20 minutes of running at the earliest; then it waits at least 15 minutes before switching on again (compressor protection). All numbers, the time window (default 11 am to 6 pm), the set temperature and the conditions “only from outdoor temperature”, “only from room temperature” and “only when someone / nobody is at home” are set per device."
K69 = "Feed-in comes via MQTT from the <b>Smartmeter</b> plugin (<code>haus/energie/…</code>, there “Provide values for other plugins”), outdoor temperature and PV forecast from the <b>Weatherdata</b> plugin (<code>haus/wetter/…</code>, <code>haus/pv/…</code>). If Smartmeter is silent or reports no fresh measurement, <b>nothing is switched on</b>; if it fails during pre-cooling (2 minutes without sign of life, then another 5 minutes), the plugin switches off regularly. Without valid weather data the outdoor condition is dropped, without a valid forecast the forecast is ignored."
K70 = "The plugin <b>only switches off what it switched on itself</b> – it remembers this across a restart. A device that is already running is left alone. If you operate the running device yourself (remote control: off, other mode or temperature; or a command from Loxone), your hand takes over: the plugin leaves the device alone until the next day. Every action is logged and briefly published under <code>&lt;prefix&gt;/vorkuehlen/meldung</code>; the Test tab shows whether <code>haus/energie</code> arrives and what each device is waiting for. Switching uses the same commands as via MQTT (ein, betriebsart, soll); the second tick of the MQTT commands is not needed – it protects the input for foreign commands, the switch per device is your consent."
K71 = "Home battery and pre-cooling (since 4.5.23)"
K72 = "With a home battery the grid meter is misleading: while the battery charges, nothing flows into the grid although solar power is left over – and while it discharges to supply the air conditioner, the house takes nothing from the grid. If Smartmeter (from 2.8.19) reports <code>haus/energie/frei_w</code>, the plugin uses it: it <b>switches on</b> at frei_w from the switch-on threshold (example: battery charges 3,000 W, feed-in 0 → frei_w 3,000 W → pre-cooling starts) and <b>switches off</b> at frei_w below minus the switch-off threshold (example: battery delivers 1,500 W, grid draw 0 → frei_w −1,500 W → off). With “Home battery … may be used for pre-cooling” = <b>No</b>, only real feed-in counts for switching on; switching off on battery discharge still applies. Without frei_w (older Smartmeter, battery silent), feed-in and grid draw apply as before. The <i>Test</i> tab shows per device which value currently applies."
