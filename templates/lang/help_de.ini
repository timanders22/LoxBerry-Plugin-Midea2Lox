; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Midea2Lox"
K02 = "Integration von Klimaanlagen der Midea-Gruppe in Loxone — als LoxBerry-Plugin."
K03 = "<b>Fork-Hinweis:</b> Dieses Repositorium führt die Arbeit von <b>Harald Friedl</b> (<code>seppe912</code>) fort. Er hat die Weiterentwicklung in <a href='https://github.com/seppe912/Midea2Lox/issues/15' target='_blank'>Issue #15</a> ausdrücklich freigegeben, weil er selbst keinen LoxBerry mehr betreibt. Sein Code ist die Grundlage, die Lizenz (Apache 2.0) bleibt unverändert. Was sich gegenüber 3.4.8 geändert hat, steht in den Release-Beschreibungen ab 4.0.0."
K04 = "Was das Plugin macht"
K05 = "Auf dem LoxBerry läuft ein UDP-Dienst. Er nimmt Befehle vom Miniserver entgegen und schickt sie an die Klimageräte im lokalen Netz — <b>ohne Umweg über die Wolke des Herstellers</b>. Umgekehrt meldet er deren Zustand zurück: über das MQTT-Gateway und, wenn kein Broker erreichbar ist, per HTTP an virtuelle Eingänge des Miniservers."
K06 = "Die Zugangsdaten des Hersteller-Kontos werden <b>nur bei der Gerätesuche</b> gebraucht, um für Geräte mit Protokoll V3 Token und Schlüssel abzuholen; danach läuft alles im eigenen Netz. <b>Ohne eigenes Konto geht es auch</b> — msmart-ng benutzt dann seine Sammelkonten, und das genügt in aller Regel. Ein eigenes Konto hilft, wenn die Suche für ein V3-Gerät keinen Token liefert. Bis 4.2.12 wurden die Felder übrigens gar nicht ausgewertet; seit 4.3.0 werden sie wirklich übergeben."
K07 = "Installation"
K08 = "Archiv im LoxBerry-Plugin-Verwalter installieren."
K09 = "Reiter <b>Einstellungen</b>: Miniserver, UDP-Port und die Zugangsdaten des Midea-Kontos eintragen, Region wählen."
K10 = "<b>Speichern und Geräte suchen</b> — das dauert bis zu einer Minute."
K11 = "Reiter <b>Test</b>: Selbstprüfung ansehen. Erst wenn dort kein <b>Kreuz</b> mehr steht, lohnt der Weg nach Loxone. Ein <b>Strich</b> ist kein Kreuz - er heißt nur, dass sich die Frage hier nicht messen ließ."
K12 = "Reiter <b>Einbindung in Loxone</b>: Schritt für Schritt, mit drei fertigen Seiten aus dem LoxBerry-Plugins Musterprojekt (Zustand und Ein/Aus, Betrieb, Komfort und Energie) – je Seite eine Anleitung zum Übernehmen, die Baustein-Tabelle, Hinweise und ein Bild."
K13 = "Voraussetzungen"
K14 = "LoxBerry 4 empfohlen (LoxBerry 3 auf Debian 12 funktioniert ebenfalls)"
K15 = "<b>Python ≥ 3.10</b> — das prüft <code>preroot.sh</code> und bricht sonst mit einer Meldung ab. Ältere, über Jahre hochgezogene LoxBerry-Installationen bringen teils noch Python 3.7 oder 3.9 mit; hier hilft nur ein aktuelles Abbild."
K16 = "<b>Kein zusätzliches Plugin.</b> Der MQTT-Gateway ist seit LoxBerry 3 Bestandteil des Systems (<code>webfrontend/htmlauth/system/mqtt.cgi</code>, erreichbar unter <i>System → MQTT Gateway</i> bzw. <code>/admin/system/mqtt.cgi</code>). In der Vorgabekonfiguration steht der Broker auf <code>localhost:1883</code> und der Gateway startet automatisch mit."
K17 = "Die Python-Module werden in eine <b>eigene virtuelle Umgebung</b> unter <code>bin/plugins/Midea2Lox/venv</code> installiert. Das System-Python bleibt unangetastet — und PEP 668, an dem systemweite pip-Installationen auf Debian 12/13 scheitern, spielt keine Rolle."
K18 = "Unterstützte Geräte"
K19 = "Klimageräte der Midea-Gruppe und ihrer Handelsmarken (Comfee, Kaisai, Senville, Pioneer, Qlima, Rotenso, Inventor und viele weitere). Die eigentliche Arbeit leistet <a href='https://github.com/mill1000/midea-msmart' target='_blank'>msmart-ng</a> von mill1000 — dort steht auch, welche Geräte bekannt sind."
K20 = "Ursprüngliche README (Stand 3.4.8)"
K21 = "Midea2Lox"
K22 = "Integration von Mideagroup Klimaanlagen in Loxone. ----- mit Loxone nicht getestet, folgende Hersteller können aber funktionieren---- Custom Integration for Midea Group(Ariston, Hualing, Senville, Klimaire, Kaysun, AirCon, Century, Pridiom, Thermocore, Comfee, Alpine Home Air, Artel, Beko, Electrolux, Galactic, Idea, Inventor, Kaisai, Mitsui, Mr. Cool, Neoclima, Olimpia Splendid, Pioneer, QLIMA, Royal Clima, Qzen, Toshiba, Carrier, Goodman, Friedrich, Samsung, Kenmore, Trane, Lennox, LG and much more) Air Conditioners via LAN. ----- nicht getestet----"
K23 = "Dieses Loxberry Plugin ermöglicht eine kommunikation zwischen dem Loxberry/Loxone zu Midea Klimaanlagen."
K24 = "Der Hauptpart, das Python3 Midea Script, stammt im Ursprung von NeoAcheron https://github.com/NeoAcheron/midea-ac-py (Cloud Version bis Midea2Lox 1.1) . Vielen Dank dafür, ohne dieses Plugin hätte das nicht funktioniert. Für die Steuerung über LAN (ab Midea2Lox V2.0) hat mac_zhou mit msmart https://github.com/mac-zhou/midea-msmart großartige leistung geleistet. Danke dafür! (Thanks mac-zhou!) msmart wird nun weiterentwickelt von mill1000 --&gt; https://github.com/mill1000/midea-msmart"
K25 = "Installation:"
K26 = "Plugin herunterladen und im Pluginmanager des Loxberry installieren. Anschließend gewünschten Empfangsport angeben,danach kann über start der Service gestartet werden."
K27 = "Das Plugin übernimmt die Kommunikation zwischen Midea und Loxberry.Auf dem Loxberry läuft ein UDP Server, der bei Befehlseingang diese an Midea schickt. Der Aktuelle Status wird über die Virtuellen Eingänge des Loxberry direkt ausgegeben/geschalten, daher müssen die Eingänge in Loxone genau den Wortlaut wie in der Beispielkonfig haben.Die Beispielkonfig für Loxone ist auch hier zu finden."
K28 = "Weitere Infos sind unter https://www.loxwiki.eu/display/LOXBERRY/Midea2Lox zu finden"
K29 = "Ab Midea2Lox V2.0 findet die kommunikation direkt über LAN ohne Cloud statt."
K30 = "Midea 8370 Protocol / V3, bspw. EU-OSK103"
K31 = "Ab Midea2Lox V3.0 werden die neueren Sticks mit Protokoll Version 3 über LAN unterstützt."
K32 = "Was 4.3.0 bringt"
K33 = "Ein <b>Abfragetakt</b>: das Plugin holt die Werte von sich aus, ohne dass Loxone etwas schicken muss. Er steht <b>ab Werk auf 0, also aus</b> — wer den Takt schon in Loxone gebaut hat, würde sonst jedes Gerät doppelt abfragen. Untergrenze 30 Sekunden."
K34 = "Ein <b>Lebenszeichen</b> unter <code>&lt;Präfix&gt;/status/…</code>. Ein virtueller Eingang behält seinen letzten Wert — ohne Lebenszeichen sieht ein toter Dienst in der App aus wie ein ruhiger. Der Zeitstempel geht bei jedem Durchgang hinaus; der Miniserver rechnet das Alter selbst aus (Loxone-Zeit plus 1230768000 minus Zeitstempel)."
K35 = "<b>Sichern und Zurückspielen</b> über zwei Knöpfe im Reiter Einstellungen. Die Datei enthält alle Einstellungen <b>und die gefundenen Geräte samt Token und Schlüssel</b> — auf einem zweiten LoxBerry eingespielt läuft das Plugin sofort, ohne neue Gerätesuche."
K36 = "<b>Achtung:</b> damit trägt die Datei ein Geheimnis. Wer sie hat, kann die Klimageräte im selben Netz steuern. Behandeln Sie sie wie ein Passwort: nicht in ein Forum hängen und nicht an einen Fehlerbericht heften."
K37 = "<b>Zwei Loxone-Vorlagen</b> statt einer: eine für die virtuellen Eingänge und eine für den virtuellen Ausgang samt allen Befehlen. Loxone Config legt beim Import immer neu an und überschreibt nichts — zweimal eingelesen ergibt doppelte Bausteine."
K38 = "Die <b>Themenliste ist vollständig</b>: 28 Werte je Gerät statt 7, gegliedert nach Grundwerten, Komfort und Energie. Die drei Energiewerte waren bis 4.2.12 nirgends dokumentiert."
K39 = "<b>Schalten aus dem Reiter Test</b>, mit Trockenlauf. Der Befehl geht über denselben Weg wie ein Befehl aus Loxone — was hier funktioniert, funktioniert dort."
K40 = "Was Sie wissen sollten"
K41 = "Die <b>Region</b> bildet das Plugin auf einen der drei Serverbereiche ab, die msmart-ng kennt (DE, KR, US); alle europäischen Länder gehen über DE. Ohne Angabe nähme msmart-ng die Vorgabe US — für ein europäisches Konto der falsche Server. Steht in Ihrer Konfiguration noch eine Region, die es nicht mehr gibt, sagt das Plugin es und ändert nichts von sich aus."
K42 = "Die <b>Energiewerte</b> sind nicht an einem Gerät nachgemessen. msmart-ng schreibt selbst, viele Geräte meldeten sie, ohne sie anzukündigen. Bevor Sie sie als Zählerstand nach Loxone geben, vergleichen Sie sie einmal mit dem, was das Gerät oder ein Zwischenzähler anzeigt — eine Zahl, die richtig aussieht, ist schlimmer als keine."
K43 = "Der Reiter <b>Test</b> beantwortet Zeile für Zeile, ob die Einrichtung trägt — ohne dass Sie dafür nach Loxone müssen. Ein <b>Strich</b> ist dort ausdrücklich kein Haken: er heißt, dass sich die Frage nicht messen ließ."
K50 = "Der Reiter <b>Automatik</b>"
K51 = "Die Automatik verschiebt die Solltemperatur, wenn der Strom gerade günstig ist oder die eigene Anlage mehr liefert, als das Haus braucht. Sie holt die Preise <b>nicht selbst</b> — das tun die Spotpreis-Plugins bereits, und den Überschuss kennt die Einspeisebremse. Midea2Lox hört nur auf deren MQTT-Themen zu."
K52 = "Die Richtung ergibt sich aus der Betriebsart: beim <b>Kühlen</b> wird der Sollwert gesenkt, beim <b>Heizen</b> angehoben. In Betriebsarten ohne Sollwert geschieht nichts."
K53 = "<b>Die Automatik macht nur das rückgängig, was sie selbst getan hat.</b> Ein Gerät, das Sie eingeschaltet vorgefunden haben, schaltet sie nicht aus. Jeder Befehl aus Loxone oder vom Reiter Test setzt sie für die eingestellte Sperrzeit aus — eine reine Statusabfrage nicht. Dabei stellt sie den Sollwert zurück, <b>schaltet aber nicht</b>: sonst ginge ein Gerät aus, das Sie gerade eingeschaltet haben."
K54 = "Bleibt ein Signal länger aus als die eingestellte Höchstdauer, gilt es als nicht vorhanden, und die Automatik stellt den vorgefundenen Zustand wieder her. Ob überhaupt etwas ankommt, sagt der Reiter <b>Test</b>: sehen Sie dort nach, bevor Sie die Automatik einschalten."
K55 = "Fenster offen: Gerät aus"
K56 = "Im Reiter <b>Automatik</b>, <b>ab Werk aus</b>. Eingeschaltet hört das Plugin auf die Haus-Themen <code>haus/tuer/&lt;name&gt;/offen</code> (0 = zu, 1 = offen, <code>-</code> = keine Aussage). Sie kommen von <b>Matter2Lox</b>, wenn dort die Haus-Themen eingeschaltet sind; jeder Kontaktsensor gilt dort als Tür, also auch ein Fensterkontakt. Die Beschattung Fensterbilanz liefert kein solches Thema. Je Gerät tragen Sie eine Liste von Fenstern ein: <code>&lt;Gerätenummer&gt;:&lt;name&gt;+&lt;name&gt;</code>, mehrere Geräte durch Komma getrennt."
K57 = "Bleibt ein zugeordnetes Fenster länger offen als die Frist (Vorgabe 60 s, einstellbar 0 bis 600), bekommt das Gerät <b>einen</b> Aus-Befehl - einen je Öffnung, auch wenn weitere Fenster dazukommen. <b>Schließt das Fenster, wird das Gerät nicht wieder eingeschaltet.</b> Solange ein Fenster offen ist, greift die Automatik bei diesem Gerät nicht zu."
K58 = "Ein Wert, der beim Start oder nach einem Wiederverbinden nur aus dem Speicher des Brokers kommt, löst nichts aus - erst ein frisch gesendetes Öffnen. Schweigt die Quelle oder meldet sie <code>-</code>, passiert nichts, und der Reiter <b>Test</b> sagt es je Fenster."
K59 = "Gleicher Befehl innerhalb von 60 s"
K60 = "Schickt Loxone denselben Sollwert an dasselbe Gerät innerhalb von 60 s noch einmal (Ein/Aus, Temperatur, Betriebsart, Lüfter, Schwenken, Eco, Turbo und die übrigen Ein/Aus-Schalter, Feuchte, Winkel, Stufe), geht er nicht erneut an das Gerät; im Protokoll steht <code>UNVERAENDERT=1</code>. Ein anderer Wert geht sofort hinaus. Immer wirken <code>toggle_Display</code>, <code>toggle_self_clean</code>, <code>status</code> und der Knopf <b>Senden</b> im Reiter <b>Test</b>. Stellt die Automatik, die Fensterkopplung oder - in einer Statusabfrage sichtbar - die Fernbedienung das Gerät anders, gilt der nächste Befehl wieder als neu."
K61 = "Befehle über MQTT, Fehlwerte und Anwesenheit (seit 4.5.18)"
K62 = "<b>Befehle über MQTT</b> (Reiter MQTT, <b>ab Werk aus</b>): mit dem Haken „Befehle über MQTT annehmen“ abonniert der Dienst <code>&lt;Präfix&gt;/befehl/&lt;Gerätenummer&gt;/&lt;Name&gt;</code> und reiht jeden Befehl in dieselbe Warteschlange ein wie einen UDP-Befehl – gleicher Wert binnen 60 s geht nicht erneut hinaus, jeder Befehl außer „abfragen“ setzt den Handvorrang der Automatik. 17 Namen: ein, betriebsart, luefter, schwenken, soll, feuchte, spar, schnell, nacht, fernbedienung, frostschutz, luftreinigung, ton, anzeige, selbstreinigung, abfragen, leistungsstufe. Ein/Aus, Betriebsart, Frostschutz und Selbstreinigung brauchen den zweiten Haken. Jeder im Heimnetz kann über den UDP-Eingang des MQTT-Gateways senden – deshalb sind beide Haken ab Werk aus."
K63 = "Das Plugin quittiert unter <code>…/quittung</code> nach dem Gespräch mit dem Gerät: „angenommen“ oder „abgelehnt: …“ (GERAET_ANTWORTET_NICHT, KANN_DAS_GERAET_NICHT, AUSSERHALB_GERAETEBEREICH, wiederholt (vor n s), GERAET_UNBEKANNT, unbekannter Befehl, Wert ungueltig, zweiter Haken aus). Nie „retain“ senden: ein zurückbehaltener Befehl wird verworfen. Unter MQTT 3.1.1 wirkt ein live mit „retain“ gesendeter Befehl einmal; verworfen wird jede spätere Zustellung aus dem Speicher des Brokers (nach Neustart oder Wiederverbinden)."
K64 = "<b>Fehlwerte:</b> was ein erfolgreicher Abruf nicht liefert, kommt als <code>-1</code> (Temperaturen <code>-999</code>, Texte weiter „-“) – nicht mehr als „-“, das ein Virtueller Eingang als 0 liest. Ein Offline-Gerät meldet nur <code>online = 0</code>; seine Zustände bleiben stehen. <code>rate_select</code> und <code>breeze_mode</code> gehen nur noch mit Fähigkeit hinaus, sonst einmal „-“. Prüfungen in Loxone auf „= 0“ sehen künftig -1 bzw. -999."
K65 = "<b>Anwesenheit</b> (Reiter Automatik, <b>ab Werk aus</b>): das Plugin hört auf <code>haus/anwesenheit/jemand</code> (z. B. vom BLE-Scanner NG ab 1.3.28). Sendet die Quelle live 0 und bleibt es die Frist (Vorgabe 300 s) dabei, verschiebt es einmal je Abwesenheit den Sollwert der eingeschalteten Geräte um 3,0 K in die sparsame Richtung (wahlweise Sparbetrieb oder Ausschalten). Bei 1 stellt es nur zurück, was es selbst verstellt hat, und schaltet nie ein. Ändert sich <code>haus/anwesenheit/zaehler</code> länger als 120 s nicht oder kommt „-“, stellt es ebenso zurück und tut nichts weiter; der Reiter Test sagt es. Es schreibt nichts unter <code>haus/</code>."
K66 = "Der UDP-Befehlseingang bleibt für bestehende Anlagen und horcht jetzt auf allen Adressen (Schutz ist der Absenderfilter: nur die Miniserver und der LoxBerry selbst); der Knopf „Senden“ im Reiter Test schickt an 127.0.0.1. Die Vorlage mit Virtuellen HTTP-Eingängen ist entfallen – die Namen stehen in der Namenstabelle im Reiter Einbindung in Loxone."
K67 = "Mit Sonnenstrom vorkühlen (seit 4.5.22)"
K68 = "Im Reiter <b>Automatik</b> je Gerät ein Schalter, <b>ab Werk aus</b>. Eingeschaltet kühlt das Klimagerät mit Strom, den Ihre Solaranlage gerade ins Netz einspeist. Beispiel: Es ist 13 Uhr, die Anlage speist seit 10 Minuten mehr als 800 W ein – das Plugin schaltet das Gerät ein, stellt Kühlen und 23 °C ein. Bezieht das Haus danach 5 Minuten lang mehr als 200 W aus dem Netz, schaltet es das Gerät wieder aus, frühestens nach 20 Minuten Laufzeit; danach wartet es mindestens 15 Minuten, bevor es wieder einschaltet (Schutz des Kompressors). Alle Zahlen, das Zeitfenster (Vorgabe 11 bis 18 Uhr), die Solltemperatur und die Bedingungen „nur ab Außentemperatur“, „nur ab Raumtemperatur“ und „nur wenn jemand / niemand zu Hause ist“ stellen Sie je Gerät ein."
K69 = "Die Einspeisung kommt über MQTT vom Plugin <b>Smartmeter</b> (<code>haus/energie/…</code>, dort „Werte für andere Plugins bereitstellen“), die Außentemperatur und die PV-Prognose vom Plugin <b>Weatherdata</b> (<code>haus/wetter/…</code>, <code>haus/pv/…</code>). Schweigt Smartmeter oder meldet es keine frische Messung, wird <b>nichts eingeschaltet</b>; fällt es während einer Vorkühlung aus (2 Minuten ohne Lebenszeichen, dann noch 5 Minuten), schaltet das Plugin regulär aus. Ohne gültige Wetterdaten entfällt die Bedingung Außentemperatur, ohne gültige Prognose wird sie nicht beachtet."
K70 = "Das Plugin schaltet <b>nur aus, was es selbst eingeschaltet hat</b> – das merkt es sich auch über einen Neustart. Ein Gerät, das schon läuft, fasst es nicht an. Bedienen Sie das laufende Gerät selbst (Fernbedienung: aus, andere Betriebsart oder Temperatur; oder ein Befehl aus Loxone), übernimmt Ihre Hand: das Plugin lässt das Gerät bis zum nächsten Tag in Ruhe. Jede Aktion steht im Protokoll und kurz unter <code>&lt;Präfix&gt;/vorkuehlen/meldung</code>; der Reiter Test zeigt, ob <code>haus/energie</code> ankommt und worauf jedes Gerät wartet. Geschaltet wird mit denselben Befehlen wie über MQTT (ein, betriebsart, soll); den zweiten Haken der MQTT-Befehle braucht es dafür nicht – er schützt den Eingang für fremde Befehle, der Schalter je Gerät ist Ihre Zustimmung."
K71 = "Hausakku beim Vorkühlen (seit 4.5.23)"
K72 = "Mit einem Hausakku täuscht der Netzzähler: Lädt der Akku, fließt nichts ins Netz, obwohl Sonnenstrom übrig ist – und entlädt er, um das Klimagerät zu versorgen, holt das Haus nichts aus dem Netz. Meldet der Smartmeter (ab 2.8.19) <code>haus/energie/frei_w</code>, rechnet das Plugin damit: <b>eingeschaltet</b> wird bei frei_w ab der Einschaltschwelle (Beispiel: Akku lädt 3.000 W, Einspeisung 0 → frei_w 3.000 W → Vorkühlen startet), <b>ausgeschaltet</b> bei frei_w unter minus der Abschaltschwelle (Beispiel: Akku gibt 1.500 W ab, Bezug 0 → frei_w −1.500 W → aus). Mit „Hausakku … darf zum Vorkühlen genutzt werden“ = <b>Nein</b> zählt zum Einschalten nur die echte Einspeisung; das Ausschalten bei Akku-Entladung gilt trotzdem. Kommt kein frei_w (älterer Smartmeter, Akku schweigt), gilt wie bisher Einspeisung und Bezug. Der Reiter <i>Test</i> zeigt je Gerät, welche Größe gerade gilt."
K73 = "Verbindung zum Miniserver (seit 4.5.27)"
K74 = "Ist MQTT nicht verfügbar, setzt das Plugin die virtuellen Eingänge per HTTP. Wie es den Miniserver dabei anspricht, sagt im Reiter <i>Einstellungen</i> die Auswahl <b>Verbindung zum Miniserver</b>: <i>wie LoxBerry</i>, <i>unverschlüsselt</i> oder <i>verschlüsselt (TLS)</i>. <i>Wie LoxBerry</i> verbindet verschlüsselt, wenn der LoxBerry den Miniserver mit https führt (<i>System, Miniserver</i>), und nimmt dann dessen https-Port; sonst unverschlüsselt mit dem gewöhnlichen Port. Neue Installationen und Anlagen, deren Konfiguration die Einstellung noch nicht kennt, beginnen mit <i>wie LoxBerry</i>. Wer <i>unverschlüsselt</i> ausdrücklich gewählt hat, behält das; führt der LoxBerry den Miniserver mit https, zeigen das Formular und der Reiter <i>Test</i> das rot mit einem Rat, und das Protokoll nennt es einmal je Start. Benutzer und Kennwort stehen nicht mehr in der Adresse, sondern in der Kopfzeile der Anfrage. Das Zertifikat des Miniservers wird nicht beglaubigt &ndash; es lautet auf einen Namen bei Loxone, angesprochen wird die IP; der LoxBerry selbst hält es genauso. Einer Umleitung wird nicht gefolgt. Leitet der Miniserver auf https um, sagt das Protokoll das einmal je Start in einer eigenen Zeile, und der Reiter <i>Test</i> zeigt eine rote Zeile."
