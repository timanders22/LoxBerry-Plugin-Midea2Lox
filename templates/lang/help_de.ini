; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Midea2Lox"
K02 = "Integration von Klimaanlagen der Midea-Gruppe in Loxone — als LoxBerry-Plugin."
K03 = "&gt; <b>Fork-Hinweis</b> &gt; Dieses Repositorium führt die Arbeit von <b>Harald Friedl</b> (<code>seppe912</code>) fort. &gt; Er hat die Weiterentwicklung in <a href='https://github.com/seppe912/Midea2Lox/issues/15' target='_blank'>Issue #15</a> &gt; ausdrücklich freigegeben, weil er selbst keinen LoxBerry mehr betreibt. &gt; Sein Code ist die Grundlage, die Lizenz (Apache 2.0) bleibt unverändert. &gt; Was sich gegenüber 3.4.8 geändert hat, steht in den Release-Beschreibungen ab 4.0.0."
K04 = "Was das Plugin macht"
K05 = "Auf dem LoxBerry läuft ein UDP-Dienst. Er nimmt Befehle vom Miniserver entgegen und schickt sie an die Klimageräte im lokalen Netz — <b>ohne Umweg über die Wolke des Herstellers</b>. Umgekehrt meldet er deren Zustand zurück: per UDP und, falls das MQTT-Gateway installiert ist, zusätzlich per MQTT."
K06 = "Die Zugangsdaten des Hersteller-Kontos werden <b>nur bei der Gerätesuche</b> gebraucht, um für Geräte mit Protokoll V3 Token und Schlüssel abzuholen; danach läuft alles im eigenen Netz. <b>Ohne eigenes Konto geht es auch</b> — msmart-ng benutzt dann seine Sammelkonten, und das genügt in aller Regel. Ein eigenes Konto hilft, wenn die Suche für ein V3-Gerät keinen Token liefert. Bis 4.2.12 wurden die Felder übrigens gar nicht ausgewertet; seit 4.3.0 werden sie wirklich übergeben."
K07 = "Installation"
K08 = "Archiv im LoxBerry-Plugin-Verwalter installieren."
K09 = "Reiter <b>Einstellungen</b>: Miniserver, UDP-Port und die Zugangsdaten des Midea-Kontos eintragen, Region wählen."
K10 = "<b>Speichern und Geräte suchen</b> — das dauert bis zu einer Minute."
K11 = "Reiter <b>Test</b>: Selbstprüfung ansehen. Erst wenn dort alles grün ist, lohnt der Weg nach Loxone."
K12 = "Reiter <b>Einbindung in Loxone</b>: Schritt für Schritt, mit vollständiger Baustein-Liste zum Nachbauen."
K13 = "Voraussetzungen"
K14 = "LoxBerry 4 empfohlen (LoxBerry 3 auf Debian 12 funktioniert ebenfalls)"
K15 = "<b>Python ≥ 3.10</b> — das prüft <code>preroot.sh</code> und bricht sonst mit einer Meldung ab. Ältere, über Jahre hochgezogene LoxBerry-Installationen bringen teils noch Python 3.7 oder 3.9 mit; hier hilft nur ein aktuelles Abbild."
K16 = "<b>Kein zusätzliches Plugin.</b> Der MQTT-Gateway ist seit LoxBerry 3 Bestandteil des Systems (<code>webfrontend/htmlauth/system/mqtt.cgi</code>, erreichbar unter <i>System → MQTT Gateway</i> bzw. <code>/admin/system/mqtt.cgi</code>). In der Vorgabekonfiguration steht der Broker auf <code>localhost:1883</code> und der Gateway startet automatisch mit."
K17 = "Die Python-Module werden in eine <b>eigene virtuelle Umgebung</b> unter <code>bin/plugins/Midea2Lox/venv</code> installiert. Das System-Python bleibt unangetastet — und PEP 668, an dem systemweite pip-Installationen auf Debian 12/13 scheitern, spielt keine Rolle."
K18 = "Unterstützte Geräte"
K19 = "Klimageräte der Midea-Gruppe und ihrer Handelsmarken (Comfee, Kaisai, Senville, Pioneer, Qlima, Rotenso, Inventor und viele weitere). Die eigentliche Arbeit leistet <a href='https://github.com/mill1000/midea-msmart' target='_blank'>msmart-ng</a> von mill1000 — dort steht auch, welche Geräte bekannt sind."
K20 = "Ursprüngliche README (Stand 3.4.8)"
K21 = "Midea2Lox"
K22 = "Integration von Mideagroup Klimaanlagen in Loxone. ----- mit Loxone nicht getestet, folgende Hersteller können aber funktionieren---- Custom Integration for Midea Group(Ariston, Hualing, Senville, Klimaire, Kaysun, AirCon, Century, Pridiom, Thermocore, Comfee, Alpine Home Air, Artel, Beko, Electrolux, Galactic, Idea, Inventor, Kaisai, Mitsui, Mr. Cool, Neoclima, Olimpia Splendid, Pioneer, QLIMA, Royal Clima, Qzen, Toshiba, Carrier, Goodman, Friedrich, Samsung, Kenmore, Trane, Lennox, LG and much more) Air Conditioners via LAN. ----- nicht getestet----"
K23 = "Dieses Loxberry Plugin ermöglicht eine kommunikation zwischen dem Loxberry/Loxone zu Midea Klimaanlagen."
K24 = "Der Hauptpart, das Python3 Midea Script, stammt im Ursprung von NeoAcheron https://github.com/NeoAcheron/midea-ac-py (Cloud Version bis Midea2Lox 1.1) . Vielen Dank dafür, ohne dieses Plugin hätte das nicht funktioniert. Für die Steuerung über LAN (ab Midea2Lox V2.0) hat mac_zhou mit msmart https://github.com/mac-zhou/midea-msmart großartige leistung geleistet. Danke dafür! (Thanks mac-zhou!) msmart wird nun weiterentwickelt von mill1000 --&gt; https://github.com/mill1000/midea-msmart"
K25 = "Installation:"
K26 = "Plugin herunterladen und im Pluginmanager des Loxberry installieren. Anschließend gewünschten Empfangsport angeben,danach kann über start der Service gestartet werden."
K27 = "Das Plugin übernimmt die Kommunikation zwischen Midea und Loxberry.Auf dem Loxberry läuft ein UDP Server, der bei Befehlseingang diese an Midea schickt. Der Aktuelle Status wird über die Virtuellen Eingänge des Loxberry direkt ausgegeben/geschalten, daher müssen die Eingänge in Loxone genau den Wortlaut wie in der Beispielkonfig haben.Die Beispielkonfig für Loxone ist auch hier zu finden."
K28 = "Weitere Infos sind unter https://www.loxwiki.eu/display/LOXBERRY/Midea2Lox zu finden"
K29 = "Ab Midea2Lox V2.0 findet die kommunikation direkt über LAN ohne Cloud statt."
K30 = "Midea 8370 Protocol / V3, bspw. EU-OSK103"
K31 = "Ab Midea2Lox V3.0 werden die neueren Sticks mit Protokoll Version 3 über LAN unterstützt."
K32 = "Was 4.3.0 bringt"
K33 = "Ein <b>Abfragetakt</b>: das Plugin holt die Werte von sich aus, ohne dass Loxone etwas schicken muss. Er steht <b>ab Werk auf 0, also aus</b> — wer den Takt schon in Loxone gebaut hat, würde sonst jedes Gerät doppelt abfragen. Untergrenze 30 Sekunden."
K34 = "Ein <b>Lebenszeichen</b> unter <code>&lt;Präfix&gt;/status/…</code>. Ein virtueller Eingang behält seinen letzten Wert — ohne Lebenszeichen sieht ein toter Dienst in der App aus wie ein ruhiger. Der Zeitstempel geht bei jedem Durchgang hinaus; der Miniserver rechnet das Alter selbst aus (Loxone-Zeit plus 1230768000 minus Zeitstempel)."
K35 = "<b>Sichern und Zurückspielen</b> über zwei Knöpfe im Reiter Einstellungen. Die Datei enthält alle Einstellungen <b>und die gefundenen Geräte samt Token und Schlüssel</b> — auf einem zweiten LoxBerry eingespielt läuft das Plugin sofort, ohne neue Gerätesuche."
K36 = "<b>Achtung:</b> damit trägt die Datei ein Geheimnis. Wer sie hat, kann die Klimageräte im selben Netz steuern. Behandeln Sie sie wie ein Passwort: nicht in ein Forum hängen und nicht an einen Fehlerbericht heften."
K37 = "<b>Zwei Loxone-Vorlagen</b> statt einer: eine für die virtuellen Eingänge und eine für den virtuellen Ausgang samt allen Befehlen. Loxone Config legt beim Import immer neu an und überschreibt nichts — zweimal eingelesen ergibt doppelte Bausteine."
K38 = "Die <b>Themenliste ist vollständig</b>: 28 Werte je Gerät statt 7, gegliedert nach Grundwerten, Komfort und Energie. Die drei Energiewerte waren bis 4.2.12 nirgends dokumentiert."
K39 = "<b>Schalten aus dem Reiter Test</b>, mit Trockenlauf. Der Befehl geht über denselben Weg wie ein Befehl aus Loxone — was hier funktioniert, funktioniert dort."
K40 = "Was Sie wissen sollten"
K41 = "Die <b>Region</b> bildet das Plugin auf einen der drei Serverbereiche ab, die msmart-ng kennt (DE, KR, US); alle europäischen Länder gehen über DE. Ohne Angabe nähme msmart-ng die Vorgabe US — für ein europäisches Konto der falsche Server. Steht in Ihrer Konfiguration noch eine Region, die es nicht mehr gibt, sagt das Plugin es und ändert nichts von sich aus."
K42 = "Die <b>Energiewerte</b> sind nicht an einem Gerät nachgemessen. msmart-ng schreibt selbst, viele Geräte meldeten sie, ohne sie anzukündigen. Bevor Sie sie als Zählerstand nach Loxone geben, vergleichen Sie sie einmal mit dem, was das Gerät oder ein Zwischenzähler anzeigt — eine Zahl, die richtig aussieht, ist schlimmer als keine."
K43 = "Der Reiter <b>Test</b> beantwortet mit 19 Zeilen, ob die Einrichtung trägt — ohne dass Sie dafür nach Loxone müssen. Ein <b>Strich</b> ist dort ausdrücklich kein Haken: er heißt, dass sich die Frage nicht messen ließ."
