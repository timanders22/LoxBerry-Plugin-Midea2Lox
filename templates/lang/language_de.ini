SCHRITT4_TEMP = "<b>Solltemperatur und Sollfeuchte stufenlos:</b> der Befehl schickt <span class='sm-mono'>temp.&lt;v.1&gt;</span> bzw. <span class='sm-mono'>humidity.&lt;v.0&gt;</span>; der angeschlossene Analogwert setzt die Temperatur (halbe Grad gehen, zum Beispiel <span class='sm-mono'>temp.20.5</span>) bzw. die Sollfeuchte in ganzen Prozent. Bis 4.5.14 stand im Temperaturbefehl <span class='sm-mono'>&lt;v&gt;</span> - halbe Grad und einstellige Werte verwarf der Dienst. Wer die Befehlsvorlage früher importiert hat, ändert den Befehl von Hand oder importiert sie neu."
WAS = "Was"
