BEFEHL_AUS = "Befehl bei Aus"
SCHRITT5 = "Schritt 5: Ausfallerkennung"
SCHRITT5_TEXT = "Fällt etwas aus, behält ein Virtueller Eingang seinen <b>letzten Wert</b>. Für das Plugin zählt das Lebenszeichen <span class='sm-mono'>status_zaehler</span> jede Minute weiter – eine Analogwertvalidierung (Tmc 300 s, fünfmal der Herzschlag) meldet, wenn es steht. Für das Gerät gibt es <span class='sm-mono'>online</span> (nur mit Abfragetakt, Reiter Einstellungen 60 s); <span class='sm-mono'>status_ok</span> und <span class='sm-mono'>online</span> unter Gateway V2 als „Noncached“. <span class='sm-mono'>status_ts</span> nicht verwenden (Ortszeit). Siehe „Lebenszeichen fehlt (Midea)“ auf der Seite „Midea2Lox“ in Schritt 6."
SCHRITT6 = "Schritt 6: Drei fertige Seiten aus dem Musterprojekt"
SCHRITT6_TEXT = "Die drei Seiten des LoxBerry-Plugins Musterprojekts für <b>ein</b> Klimagerät: „Midea2Lox“ (läuft es, ein/aus mit Fenster- und Abwesenheitssperre, Solltemperatur, Automatik), „Midea2Lox Betrieb“ (Betriebsart, Lüfterstufe, Schwenken, Sollfeuchte) und „Midea2Lox Komfort und Energie“ (Sonderfunktionen, Filter, Leistung und Energie). Je Seite eine Anleitung zum Übernehmen, die Tabelle, Hinweise und ein Bild. Wer die Tabelle von oben nach unten abarbeitet, hat die Seite nachgebaut; die Bausteine findet man in Loxone Config über die Baustein-Suche (F5). Die Namen der Eingänge und Befehle stehen hier mit dem eingestellten Präfix und der Nummer des ersten Geräts."
