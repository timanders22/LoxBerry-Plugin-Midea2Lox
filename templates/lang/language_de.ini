K_VORLAGE_AUS = "Vorlage der Befehle erzeugen"
VORLAGE_WARNUNG = "<b>Achtung:</b> Loxone Config legt beim Import immer neu an und überschreibt nichts. Zweimal eingelesen ergibt doppelte Bausteine, und das fällt niemandem auf."
SCHRITT4 = "Schritt 4: Befehle an das Klimagerät"
