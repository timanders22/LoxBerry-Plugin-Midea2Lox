SEITE1_SCHRITT1 = "Im Plugin Reiter „Test“ → „Jetzt nach Geräten suchen“. Das Klimagerät erscheint mit seiner Nummer (10 bis 19 Ziffern). Im Reiter „Einstellungen“ dem Gerät eine Bezeichnung geben (z. B. „Klima Wohnzimmer“) und „Abfragetakt“ auf 60 stellen, speichern – ohne Abfragetakt kommen „online“ und die Gerätewerte nicht, und die Störung meldet nach 10 Minuten. Reiter „Test“ → „Zustand aller Geräte abfragen“: es erscheinen Werte."
SEITE1_SCHRITT2 = "MQTT-Gateway: Das Abo „Midea2Lox/#“ bringt das Plugin mit. Reiter „Test“, Zeile „Ist unser Thema im Gateway abonniert?“ muss „ja“ sagen; sonst das Abo unter System → MQTT Gateway → Subscriptions eintragen."
SEITE1_SCHRITT3 = "Reiter „Einbindung in Loxone“ → „Vorlage der Eingänge erzeugen“ und „Vorlage der Befehle erzeugen“. In Loxone Config beide Dateien importieren (Peripherie → Virtuelle Eingänge bzw. Virtuelle Ausgänge → Vorlage importieren), jede nur EINMAL – zweimal ergibt doppelte Bausteine. Die zwei Behälter „Midea Klimageraete“ und „Midea2Lox Befehle“ dienen allen drei Seiten. Die Befehlsvorlage des Plugins trägt die IP des LoxBerry (im Musterprojekt steht dort „loxberry“)."
SEITE1_SCHRITT4 = "Seite „Midea2Lox“ anlegen. Aus „Midea Klimageraete“ die 11 Befehle der Liste ziehen (Nr. 1–3, 11–15, 26–28), aus „Midea2Lox Befehle“ die zwei Befehle Nr. 22 und 24; dazu „Konstante 1“ und „Niemand zu Hause (eigene Quelle)“, falls schon im Projekt (sonst als Konstante bzw. Schalter neu). Neu anlegen (Peripherie → Virtuelle Eingänge): Schalter „Klima ein (Midea)“, Schalter „Fenster offen (eigene Quelle)“, Schieberegler „Solltemperatur (Midea)“ (16–30, Schritt 0,5); Virtueller Texteingang „Midea2Lox_automatik_grund“ – Name genau so."
SEITE1_SCHRITT5 = "Benachrichtigung „Meldung Plugin gestört (Midea)“ anlegen (Peripherie → Mitteilungen → Benachrichtigung), Text wie in der Liste. Sie bekommt genau eine Leitung (von Nr. 8)."
SEITE1_SCHRITT6 = "Übrige Bausteine über die Baustein-Suche (F5), Parameter wie in der Liste, von oben nach unten verbinden. Analogwertvalidierung Nr. 5: Haken bei ‚En‘ im Eigenschaftsfenster entfernen (Config legt En negiert an; sonst kommt die Konstante 1 als 0 an). UND Nr. 20: beide Eingänge negieren – auf den Eingangspunkt klicken, danach zeigt der Eingang einen kleinen Kreis. Status „Klima (Midea)“: vorher dreimal „+“; Zeilen in der angegebenen Reihenfolge, die ohne Bedingung zuletzt. „Statistik“ am Eingang Nr. 12 (Raumtemperatur) einschalten."
SEITE1_SCHRITT7 = "Speichern und übertragen. Probe: „Zustand (Midea)“ zeigt „läuft – Klimagerät erreichbar“; Midea2Lox_status_zaehler zählt jede Minute weiter; der Schalter „Klima ein (Midea)“ schaltet das Gerät nach wenigen Sekunden."
SEITE1_H1 = "<b>Zu Nr. 1 und 5:</b> steht der LoxBerry, das MQTT-Gateway oder der Dienst, behalten alle Eingänge ihren letzten Wert – nur der stehende Zähler <span class='sm-mono'>Midea2Lox_status_zaehler</span> verrät es. Kommt innerhalb Tmc (300 s) kein neuer Wert, meldet die Analogwertvalidierung an ihrem Ausgang E. Den Haken bei ‚En‘ im Eigenschaftsfenster entfernen."
SEITE1_H2 = "<b>Zu Nr. 3 und 6 bis 9:</b> „online“ kommt nur mit Abfragetakt (Schritt 1). Die Meldung „Plugin gestört“ kommt nach etwa 10 Minuten, wenn das Gerät nicht antwortet, und nach etwa 15 Minuten (5 Minuten Lebenszeichen und 10 Minuten), wenn das Plugin steht. Eine Benachrichtigung bekommt nur eine Quelle – beide Störungen laufen über das ODER Nr. 7."
SEITE1_H3 = "<b>Zu Nr. 17 bis 21:</b> beide Eingänge des UND Nr. 20 sind negiert. Das Gerät geht nach 1 Minute offenem Fenster bzw. sofort bei „niemand zu Hause“ aus und wieder an, sobald beides vorbei und der Schalter ein ist. Das Plugin kann das Fenster auch selbst (Reiter Automatik, „Fenster offen: Gerät aus“, über Matter2Lox) – dort schaltet es NICHT wieder ein. Im eigenen Haus nur einen der beiden Wege wählen."
SEITE1_H4 = "Im eigenen Projekt steht in jedem Namen die eigene Gerätenummer statt 123456789012 – die Vorlagen und diese Tabelle bringen das richtig mit."
SEITE1_H5 = "Jeder Befehl aus Loxone setzt die Automatik des Plugins für die Sperrzeit aus (ab Werk 120 Minuten) – „Handvorrang“. Eine Abfrage nicht. Die Automatik-Werte (Nr. 26–30) kommen nur, wenn die Automatik im Plugin eingeschaltet ist; sonst bleiben sie 0."
SEITE1_H6 = "Mehrere Klimageräte: für jedes Gerät dieselben Gerätebausteine mit seiner Nummer; die Störungen über weitere ODER (je zwei Eingänge) vor Nr. 8 führen – nie mehrere Quellen direkt an die Benachrichtigung."
SEITE1_H7 = "Die Befehle gehen per UDP an den LoxBerry; das Plugin nimmt sie nur vom eigenen Miniserver an. Der Solltemperatur-Befehl schickt seit 4.5.15 <span class='sm-mono'>temp.&lt;v.1&gt;</span> – halbe Grad gehen."
SEITE1_H8 = "Wer die Loxone-Klimaanlagensteuerung oder die Intelligente Raumregelung nutzt, legt deren Sollwert an „Solltemperatur stufenlos“ (Nr. 24) und deren Ein/Aus an „Ein- und ausschalten“ (Nr. 22) – nicht Teil des Musterprojekts."
SEITE1_H9 = "Bewusst nicht im Musterprojekt: <span class='sm-mono'>status/ts</span>, <span class='sm-mono'>status/dienst</span> (der Zähler sagt es zuverlässiger), <span class='sm-mono'>connection/status</span>, iECO, Schwenkwinkel, Lüfterstufen als Zahl, <span class='sm-mono'>rate_select</span>, <span class='sm-mono'>breeze_mode</span> und der HTTP-Rückfallweg ohne Broker."
SEITE2_SCHRITT1 = "Behälter aus Seite „Midea2Lox“, Schritt 3 (nicht erneut importieren)."
SEITE2_SCHRITT2 = "Neue Seite „Midea2Lox Betrieb“, die 18 Befehle der Liste ziehen (17 aus „Midea2Lox Befehle“, Nr. 21 aus „Midea Klimageraete“). Neu anlegen: Schieberegler „Sollfeuchte (Midea)“ (35–70, Schritt 5), Taste „Jetzt abfragen (Midea)“, drei Virtuelle Texteingänge mit den Namen Nr. 22–24 genau so, „In Visualisierung verwenden“ an."
SEITE2_SCHRITT3 = "Drei Radiotasten über F5: Anzahl der Tasten und Tastentexte wie in der Liste, Remanenz abhaken. Ausgang Q1, Q2, Q3 … der Radiotasten an den Befehl derselben Zeile (Q1 an den ersten Befehl darunter usw.)."
SEITE2_SCHRITT4 = "Status „Betrieb (Midea)“ setzen, verbinden. Speichern und übertragen. Probe: in der App „Kühlen“ wählen – nach der nächsten Abfrage (höchstens 1 Minute, oder „Jetzt abfragen“) zeigt der Texteingang „operational_mode_enum.cool“."
SEITE2_H1 = "Die Radiotasten zeigen, was zuletzt aus der App gewählt wurde; was das Gerät wirklich tut (auch nach der Fernbedienung), zeigen die Texteingänge Nr. 22–24."
SEITE2_H2 = "<b>Zu Nr. 1, 7 und 14:</b> Remanenz aus – sonst schickt der Miniserver nach einem Neustart die zuletzt gewählte Taste erneut, und jeder Befehl setzt den Handvorrang der Automatik."
SEITE2_H3 = "In der Betriebsart Automatik stellt das Gerät die Lüfterstufe selbst; eine andere Stufe setzt das Plugin auf Automatik zurück."
SEITE2_H4 = "Die Sollfeuchte wirkt nur bei Geräten mit Feuchteregelung (Entfeuchten); andere übergehen den Befehl, das Protokoll sagt es. Der Befehl „Sollfeuchte stufenlos“ ist neu in 4.5.15 – wer die Befehlsvorlage früher importiert hat, legt ihn von Hand an oder importiert neu."
SEITE3_SCHRITT1 = "Behälter wie oben. Neue Seite „Midea2Lox Komfort und Energie“, die 21 Befehle ziehen (9 aus „Midea2Lox Befehle“, 12 aus „Midea Klimageraete“); „Statistik“ an Leistung (Nr. 30) und Energie gesamt (Nr. 31) einschalten."
SEITE3_SCHRITT2 = "Neu anlegen: sieben Schalter, zwei Tasten (Namen wie in der Liste), Benachrichtigung „Meldung Filter reinigen (Midea)“."
SEITE3_SCHRITT3 = "Status über F5; „Komfort (Midea)“ vorher viermal „+“. Speichern und übertragen. Probe: „Sparbetrieb (Midea)“ ein – nach der nächsten Abfrage zeigt „Komfort (Midea)“ „Spar 1“."
SEITE3_H1 = "Nicht jedes Gerät kann jede Funktion; was es nicht kann, übergeht das Plugin mit einer Warnung im Protokoll, der Wert bleibt 0."
SEITE3_H2 = "Frostschutz stellt das Gerät auf Heizen."
SEITE3_H3 = "<b>Zu Nr. 28 und 29:</b> die Filter-Meldung kommt nach jedem Übertragen erneut, solange das Gerät „Filter reinigen“ meldet – Filter reinigen, am Gerät zurücksetzen."
SEITE3_H4 = "Leistung und Energie liefern nicht alle Geräte; dann steht dort 0."

