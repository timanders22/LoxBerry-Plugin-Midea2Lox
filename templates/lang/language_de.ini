RETAIN_ERKLAERUNG = "<b>Zurückbehalten</b> (retained) heißt: der Broker hält den letzten Wert fest, und Loxone hat ihn nach einem Neustart sofort wieder. Das ist bei <i>Zuständen des Geräts</i> richtig und bei <i>Messwerten</i> falsch - ein alter Messwert sähe aus wie ein aktueller. Nie zurückbehalten ist auch, was der Dienst über sich selbst sagt: das <i>Lebenszeichen</i> (es würde sonst noch „lebt“ melden, wenn der Dienst längst tot ist), die Erreichbarkeit <i>online</i> (der Dienst stellt sie aus seiner eigenen Abfrage fest) und die Themen der <i>Automatik</i>. Zurückbehalten ist dagegen <i>connection/status</i>: „connected“ beim Verbinden, „disconnected“ als Letzter Wille, den der Broker selbst setzt; die Deinstallation räumt das Thema ab."
