SEITE1_SCHRITT1 = "Im Plugin Reiter „Test“ → „Jetzt nach Geräten suchen“. Das Klimagerät erscheint mit seiner Nummer (10 bis 19 Ziffern). Im Reiter „Einstellungen“ dem Gerät eine Bezeichnung geben (z. B. „Klima Wohnzimmer“) und „Abfragetakt“ auf 60 stellen, speichern – ohne Abfragetakt kommen „online“ und die Gerätewerte nicht, und die Störung meldet nach 10 Minuten. Reiter „Test“ → „Zustand aller Geräte abfragen“: es erscheinen Werte."
SEITE1_SCHRITT2 = "Im Plugin Reiter „MQTT“ die Haken „Befehle über MQTT annehmen“ und „Ein/Aus, Betriebsart, Frostschutz und Selbstreinigung über MQTT zulassen“ setzen und speichern (beide ab Werk aus). MQTT-Gateway Fassung 1: das Abo „Midea2Lox/#“ bringt das Plugin mit (Reiter „Test“, Zeile „Ist unser Thema im Gateway abonniert?“). Fassung 2: die Themen der Namenstabelle mit „V2“ anhaken, status/ok und online zusätzlich „Noncached“; befehl/… nicht anhaken."
SEITE1_SCHRITT3 = "In Loxone Config unter Peripherie → Virtuelle Eingänge die Virtuellen Eingänge der Liste anlegen – Name genau wie in der Namenstabelle des Plugins (Reiter „Einbindung in Loxone“, Kopierknopf), „Als Digitaleingang“ NICHT anhaken; die Texte (automatik_grund, Betriebsart, Lüfter, Schwenken, Leistungsstufe) als Virtueller Texteingang. Der LoxBerry-Benutzer braucht Rechte im Miniserver. Die Befehle kommen in den Virtuellen Ausgang „LoxBerry MQTT-Gateway“ (Vorlage VQ_loxberry_mqtt_gateway.xml aus dem Musterprojekt) oder alle auf einmal mit der Vorlage „MQTT-Befehle“ des Plugins."
SEITE1_SCHRITT4 = "Seite „Midea2Lox“ anlegen. Die 12 Eingänge der Liste ziehen (Nr. 1–3, 11–15, 26–28, 31) und die zwei Befehle Nr. 22 und 24; dazu „Konstante 1“ und „Niemand zu Hause (eigene Quelle)“, falls schon im Projekt (sonst als Konstante bzw. Schalter neu). Neu anlegen (Peripherie → Virtuelle Eingänge): Schalter „Klima ein (Midea)“, Schalter „Fenster offen (eigene Quelle)“, Schieberegler „Solltemperatur (Midea)“ (16–30, Schritt 0,5); Virtueller Texteingang „Midea2Lox_automatik_grund“ – Name genau so."
SEITE1_SCHRITT5 = "Benachrichtigung „Meldung Plugin gestört (Midea)“ anlegen (Peripherie → Mitteilungen → Benachrichtigung), Text wie in der Liste. Sie bekommt genau eine Leitung (von Nr. 8)."
SEITE1_SCHRITT6 = "Übrige Bausteine über die Baustein-Suche (F5), Parameter wie in der Liste, von oben nach unten verbinden. Analogwertvalidierung Nr. 5: Haken bei ‚En‘ im Eigenschaftsfenster entfernen (Config legt En negiert an; sonst kommt die Konstante 1 als 0 an). UND Nr. 20: beide Eingänge negieren – auf den Eingangspunkt klicken, danach zeigt der Eingang einen kleinen Kreis. Status „Klima (Midea)“: vorher dreimal „+“; Zeilen in der angegebenen Reihenfolge, die ohne Bedingung zuletzt. „Statistik“ am Eingang Nr. 12 (Raumtemperatur) einschalten."
SEITE1_SCHRITT7 = "Speichern und übertragen. Probe: „Zustand (Midea)“ zeigt „läuft – Klimagerät erreichbar“; Midea2Lox_status_zaehler zählt jede Minute weiter; der Schalter „Klima ein (Midea)“ schaltet das Gerät nach wenigen Sekunden (im Plugin Reiter „Test“ steht die Quittung „angenommen“)."
SEITE1_H1 = "<b>Zu Nr. 1 und 5:</b> steht der LoxBerry, das MQTT-Gateway oder der Dienst, behalten alle Eingänge ihren letzten Wert – nur der stehende Zähler <span class='sm-mono'>Midea2Lox_status_zaehler</span> verrät es. Kommt innerhalb Tmc (300 s) kein neuer Wert, meldet die Analogwertvalidierung an ihrem Ausgang E. Den Haken bei ‚En‘ im Eigenschaftsfenster entfernen."
SEITE1_H2 = "<b>Zu Nr. 3 und 6 bis 9:</b> „online“ kommt nur mit Abfragetakt (Schritt 1). Die Meldung „Plugin gestört“ kommt nach etwa 10 Minuten, wenn das Gerät nicht antwortet, und nach etwa 15 Minuten (5 Minuten Lebenszeichen und 10 Minuten), wenn das Plugin steht. Eine Benachrichtigung bekommt nur eine Quelle – beide Störungen laufen über das ODER Nr. 7."
SEITE1_H3 = "<b>Zu Nr. 17 bis 21:</b> beide Eingänge des UND Nr. 20 sind negiert. Das Gerät geht nach 1 Minute offenem Fenster bzw. sofort bei „niemand zu Hause“ aus und wieder an, sobald beides vorbei und der Schalter ein ist. Das Plugin kann beides auch selbst (Reiter Automatik: „Fenster offen: Gerät aus“ über haus/tuer/…, „Anwesenheit berücksichtigen“ über haus/anwesenheit/jemand) – dort schaltet es NICHT wieder ein. Im eigenen Haus je Aufgabe nur einen der beiden Wege wählen."
SEITE1_H4 = "Im eigenen Projekt steht in jedem Namen und in jedem Befehl die eigene Gerätenummer statt 123456789012 – die Namenstabelle und die Vorlage MQTT-Befehle des Plugins bringen das richtig mit."
SEITE1_H5 = "Jeder Befehl aus Loxone setzt die Automatik des Plugins für die Sperrzeit aus (ab Werk 120 Minuten) – „Handvorrang“ – und beendet den Abwesenheitsbetrieb des Geräts. Eine Abfrage nicht. Die Automatik-Werte (Nr. 26–30) kommen nur, wenn die Automatik im Plugin eingeschaltet ist; sonst bleiben sie 0."
SEITE1_H6 = "Mehrere Klimageräte: für jedes Gerät dieselben Gerätebausteine mit seiner Nummer; die Störungen über weitere ODER (je zwei Eingänge) vor Nr. 8 führen – nie mehrere Quellen direkt an die Benachrichtigung."
SEITE1_H7 = "Die Befehle gehen als <span class='sm-mono'>publish Midea2Lox/befehl/&lt;Nummer&gt;/&lt;Name&gt;</span> über den UDP-Eingang des MQTT-Gateways; jeder im Heimnetz kann dorthin senden – deshalb sind beide Haken im Plugin ab Werk aus. Nie „retain“: ein zurückbehaltener Befehl wird verworfen. Das Plugin quittiert unter …/quittung (im Reiter Test sichtbar). Fehlwerte: -1 = keine Aussage, -999 = Temperatur fehlt."
SEITE1_H8 = "Wer die Loxone-Klimaanlagensteuerung oder die Intelligente Raumregelung nutzt, legt deren Sollwert an „Midea2Lox: Solltemperatur“ (Nr. 24) und deren Ein/Aus an „Midea2Lox: Ein- und ausschalten“ (Nr. 22) – nicht Teil des Musterprojekts."
SEITE1_H9 = "Bewusst nicht im Musterprojekt: <span class='sm-mono'>status/ts</span>, <span class='sm-mono'>status/dienst</span> (der Zähler sagt es zuverlässiger), <span class='sm-mono'>status/befehle</span> und die Quittungen (Reiter Test), <span class='sm-mono'>connection/status</span>, iECO, Schwenkwinkel, Lüfterstufen als Zahl, <span class='sm-mono'>breeze_mode</span>, die Leistungsstufen LEVEL_1–5 und der HTTP-Rückfallweg ohne Broker."
SEITE2_SCHRITT1 = "Eingänge und Befehle wie auf Seite „Midea2Lox“ (Namenstabelle, Virtueller Ausgang „LoxBerry MQTT-Gateway“)."
SEITE2_SCHRITT2 = "Neue Seite „Midea2Lox Betrieb“, die 17 Befehle und den Eingang Nr. 21 der Liste ziehen. Neu anlegen: Schieberegler „Sollfeuchte (Midea)“ (35–70, Schritt 5), Taste „Jetzt abfragen (Midea)“, drei Virtuelle Texteingänge mit den Namen Nr. 22–24 genau so, „In Visualisierung verwenden“ an."
SEITE2_SCHRITT3 = "Drei Radiotasten über F5: Anzahl der Tasten und Tastentexte wie in der Liste, Remanenz abhaken. Ausgang Q1, Q2, Q3 … der Radiotasten an den Befehl derselben Zeile (Q1 an den ersten Befehl darunter usw.)."
SEITE2_SCHRITT4 = "Status „Betrieb (Midea)“ setzen, die drei Texteingänge an V4–V6 legen. Speichern und übertragen. Probe: in der App „Kühlen“ wählen – nach der nächsten Abfrage (höchstens 1 Minute, oder „Jetzt abfragen“) zeigt der Status „Kühlen gewählt – das Gerät meldet operational_mode_enum.cool …“."
SEITE2_H1 = "Die Radiotasten zeigen, was zuletzt aus der App gewählt wurde; was das Gerät wirklich tut (auch nach der Fernbedienung), zeigen die Texteingänge Nr. 22–24 im Status Nr. 27."
SEITE2_H2 = "<b>Zu Nr. 1, 7 und 14:</b> Remanenz aus – sonst schickt der Miniserver nach einem Neustart die zuletzt gewählte Taste erneut, und jeder Befehl setzt den Handvorrang der Automatik."
SEITE2_H3 = "In der Betriebsart Automatik stellt das Gerät die Lüfterstufe selbst; eine andere Stufe setzt das Plugin auf Automatik zurück. Die Betriebsart braucht im Plugin beide Haken (Reiter MQTT)."
SEITE2_H4 = "Die Sollfeuchte wirkt nur bei Geräten mit Feuchteregelung (Entfeuchten); andere übergehen den Befehl, die Quittung lautet dann „abgelehnt: KANN_DAS_GERAET_NICHT“."
SEITE3_SCHRITT1 = "Neue Seite „Midea2Lox Komfort und Energie“, die 12 Befehle und 12 Eingänge der Liste ziehen; „Statistik“ an Leistung (Nr. 30) und Energie gesamt (Nr. 31) einschalten."
SEITE3_SCHRITT2 = "Neu anlegen: sieben Schalter, zwei Tasten (Namen wie in der Liste), Formel Nr. 34, Radiotasten Nr. 35, Virtueller Texteingang Nr. 39 (Name genau so), Benachrichtigung „Meldung Filter reinigen (Midea)“ an die Formel Nr. 34."
SEITE3_SCHRITT3 = "Status über F5; „Komfort (Midea)“ vorher viermal „+“. Speichern und übertragen. Probe: „Sparbetrieb (Midea)“ ein – nach der nächsten Abfrage zeigt „Komfort (Midea)“ „Spar 1“."
SEITE3_H1 = "Nicht jedes Gerät kann jede Funktion; was es nicht kann, übergeht das Plugin mit einer Warnung im Protokoll und der Quittung „abgelehnt: KANN_DAS_GERAET_NICHT“; meldet das Gerät einen Zustand nicht, steht -1 da."
SEITE3_H2 = "Frostschutz stellt das Gerät auf Heizen; Frostschutz und Selbstreinigung brauchen im Plugin beide Haken (Reiter MQTT)."
SEITE3_H3 = "<b>Zu Nr. 28, 34 und 29:</b> die Formel lässt nur 1 durch – -1 (meldet das Gerät nicht) löst keine Meldung aus. Die Filter-Meldung kommt nach jedem Übertragen erneut, solange das Gerät „Filter reinigen“ meldet – Filter reinigen, am Gerät zurücksetzen."
SEITE3_H4 = "Leistung und Energie liefern nicht alle Geräte; dann steht dort -1."
