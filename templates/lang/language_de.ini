BL_ERLAEUTERUNGEN = "<b>Zu 12:</b> Die Verzögerung muss deutlich über dem Abfragetakt liegen, sonst löst ein einzelner verpasster Durchgang eine Meldung aus. <b>Zu 13:</b> Loxone rechnet in Sekunden seit dem 01.01.2009; der Zeitstempel des Plugins ist Unix-Zeit. Die 1230768000 ist der Unterschied. <b>Zu 15:</b> Der Benachrichtigungs-Baustein sendet nur beim Wechsel von Aus auf Ein - niemals mehrere Quellen direkt an seinen Eingang, sondern erst über ODER zusammenführen, sonst verschluckt eine dauerhaft aktive Quelle alle übrigen. <b>Zu 17:</b> Ein offenes Fenster sollte das Kühlen sperren."
SCHRITT7 = "Schritt 7: Gegenprobe"
SCHRITT7_TEXT = "Nach dem Speichern in Loxone im Reiter Test auf <i>Zustand aller Geräte abfragen</i> klicken. Erscheinen dort Werte, sendet das Plugin. Kommt in Loxone trotzdem nichts an, liegt es am Abo oder am Namen eines virtuellen Eingangs - beides steht in Schritt 2 und 3."
