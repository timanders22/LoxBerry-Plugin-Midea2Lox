SCHRITT6_TEXT = "So sieht die vollständige Verdrahtung für <b>ein</b> Klimagerät auf der Programmierseite aus. Wer die Tabelle von oben nach unten abarbeitet, hat die Funktion nachgebaut. Die Bausteine findet man in Loxone Config über die Baustein-Suche (F5)."
