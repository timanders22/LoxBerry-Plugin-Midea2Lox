SCHRITT1 = "Schritt 1: Der Weg der Werte – MQTT"
SCHRITT1_TEXT = "<b>MQTT</b> ist der Weg: der Dienst meldet den Zustand der Klimageräte an den Broker, das MQTT-Gateway reicht ihn an Loxone weiter, und Befehle kommen über MQTT zurück. Das Gateway ist seit LoxBerry 3 Bestandteil des Systems und muss nicht nachinstalliert werden. <b>Das Plugin sendet nicht beides</b>: ist kein Broker erreichbar, schreibt der Dienst die Werte per HTTP an virtuelle Eingänge des Miniservers mit denselben Namen (Rückfallweg, im Musterprojekt nicht gebaut)."
SCHRITT2 = "Schritt 2: Abo im MQTT-Gateway"
SCHRITT2_TEXT = "Fassung 1 des MQTT-Gateways: das Abo bringt das Plugin mit (config/mqtt_subscriptions.cfg). Fassung 2: die Themen mit „V2“ in der Namenstabelle (Schritt 3) anhaken, status/ok und online zusätzlich „Noncached“."
SCHRITT3 = "Schritt 3: Virtuelle Eingänge anlegen"
SCHRITT3_TEXT = "In <b>Loxone Config</b> unter <i>Virtuelle Eingänge</i> je Zahlenwert einen <b>Virtuellen Eingang</b> mit genau dem Namen aus der Tabelle, „Als Digitaleingang“ nicht anhaken; je Text einen <i>Virtuellen Texteingang</i>, „In Visualisierung verwenden“ an. <b>Der Name muss exakt stimmen</b> – das Gateway ordnet ausschließlich über den Namen zu. Der LoxBerry-Benutzer braucht Rechte im Miniserver."
UDP_WEG = "Port <b>%s</b> ist der <b>UDP-Befehlsport</b> des Dienstes (Absenderfilter: nur die Miniserver und der LoxBerry selbst). Die Werte kommen immer über das MQTT-Gateway (Abo <span class='sm-mono'>%s/#</span>); einen virtuellen UDP-Eingang braucht es nicht."
K_VORLAGE_AUS = "Vorlage Ausgang (UDP)"
VORLAGE_WARNUNG = "<b>Achtung:</b> Loxone Config legt beim Import immer neu an und überschreibt nichts. Zweimal eingelesen ergibt doppelte Bausteine, und das fällt niemandem auf."
SCHRITT4 = "Schritt 4: Befehle an das Klimagerät"
SCHRITT4_TEXT = "Zum Schalten einen <i>virtuellen Ausgang</i> anlegen. Adresse - %s ist der LoxBerry, %s der eingestellte UDP-Port:"
SCHRITT4_TEXT2 = "Darunter je Befehl einen <i>virtuellen Ausgang Befehl</i>. Der Befehlstext besteht aus der Geräte-Nummer, einem <b>Leerzeichen</b> und dem Befehl:"
SCHRITT4_TEMP = "<b>Solltemperatur und Sollfeuchte stufenlos:</b> der Befehl schickt <span class='sm-mono'>temp.&lt;v.1&gt;</span> bzw. <span class='sm-mono'>humidity.&lt;v.0&gt;</span>; der angeschlossene Analogwert setzt die Temperatur (halbe Grad gehen, zum Beispiel <span class='sm-mono'>temp.20.5</span>) bzw. die Sollfeuchte in ganzen Prozent. Bis 4.5.14 stand im Temperaturbefehl <span class='sm-mono'>&lt;v&gt;</span> - halbe Grad und einstellige Werte verwarf der Dienst. Wer die Befehlsvorlage früher importiert hat, ändert den Befehl von Hand oder importiert sie neu."
WAS = "Was"
