WAS_IST_DAS = "<b>Klimageräte der Midea-Gruppe in Loxone – im eigenen Netz, ohne Umweg über die Wolke des Herstellers.</b> Ein Dienst auf dem LoxBerry schickt die Befehle des Miniservers über msmart-ng an die Geräte (Midea und Handelsmarken wie Comfee, Kaisai oder Qlima) – über MQTT oder, für bestehende Anlagen, per UDP. Ihren Zustand meldet er über MQTT zurück; Loxone liest ihn über das MQTT-Gateway. Das Hersteller-Konto braucht es nur bei der Gerätesuche, für Token und Schlüssel von Geräten mit Protokoll V3."

