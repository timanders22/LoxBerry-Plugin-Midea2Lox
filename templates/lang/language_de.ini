AUTO_S1_HINWEIS = "Die üblichen Themen sind <span class='sm-mono'>spot_awattar/regel/1/aktiv</span> oder <span class='sm-mono'>tibber/regel/1/aktiv</span> für den Preis und <span class='sm-mono'>einspeisebremse/ueberschuss</span> für die Leistung in Watt. Die genauen Namen stehen im jeweiligen Plugin unter <i>MQTT</i>. Ob wirklich etwas ankommt, sagt der Reiter <b>Test</b> - sehen Sie dort nach, bevor Sie die Automatik einschalten."
