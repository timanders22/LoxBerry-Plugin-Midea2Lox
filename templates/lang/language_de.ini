PRUEF_VK = "Mit Sonnenstrom vorkühlen: eine Eingabe passt nicht (%s). Erlaubt sind: Einspeisung 100 bis 20000 W, Dauer 1 bis 120 Minuten, Bezug 0 bis 20000 W, Uhrzeit von 0 bis 23 und bis 1 bis 24 (von vor bis), außen −20 bis 50 °C oder leer, Raum 10 bis 40 °C oder leer, Solltemperatur 16 bis 30 °C, Mindestlaufzeit 0 bis 120 und Mindestpause 0 bis 240 Minuten, nur ganze Zahlen."
VK_S = "Mit Sonnenstrom vorkühlen (haus/energie, z. B. vom Smartmeter)"
VK_S_TEXT = "Ab Werk für jedes Gerät <b>aus</b>. Eingeschaltet kühlt das Klimagerät mit Strom von Ihrer Solaranlage, den Sie sonst für wenige Cent ins Netz verkaufen würden – die Wohnung ist dann am Abend schon kühl. Das Plugin schaltet das Gerät dazu selbst <b>ein</b>, stellt <b>Kühlen</b> und die Solltemperatur ein und schaltet es später wieder <b>aus</b>. Es schaltet nur ein Gerät aus, das es selbst eingeschaltet hat; ein Gerät, das schon läuft, fasst es nicht an. Bedienen Sie das laufende Gerät selbst (ausschalten, andere Betriebsart oder Temperatur, ein Befehl aus Loxone), hat Ihre Hand Vorrang: das Plugin lässt das Gerät dann bis zum nächsten Tag in Ruhe."
VK_S_BEISPIEL = "<b>Beispiel:</b> Es ist 13 Uhr, draußen 27 °C, und Ihre Anlage speist seit 10 Minuten mehr als 800 W ins Netz ein. Das Plugin schaltet die Klimaanlage im Wohnzimmer auf Kühlen mit 23 °C. Ziehen Wolken auf und das Haus bezieht 5 Minuten lang mehr als 200 W aus dem Netz, schaltet es sie wieder aus – frühestens nach 20 Minuten Laufzeit, und eingeschaltet wird frühestens 15 Minuten später wieder."
