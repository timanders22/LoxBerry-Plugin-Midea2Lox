H_VORLAGE_TEXT = "Statt jeden Baustein von Hand anzulegen, erzeugt das Plugin zwei Importdateien für Loxone Config: eine mit den <b>virtuellen Eingängen</b> und eine mit dem <b>virtuellen Ausgang samt allen Befehlen</b>. In Loxone Config über <i>Datei → Vorlagen → Vorlage importieren</i> einlesen. <b>Was in der Eingangsvorlage steht und was nicht:</b> die sieben Textwerte der Tabelle oben bekommen <i>keinen</i> virtuellen Eingang - ein virtueller Eingang trägt eine Zahl, keinen Text. Dafür enthält die Vorlage sieben zusätzliche Eingänge, die in der Tabelle oben nicht vorkommen: vier Lebenszeichen und drei der Automatik. Die Befehlstitel stehen in jeder Sprache deutsch, wie im Musterprojekt (Schritt 6)."
