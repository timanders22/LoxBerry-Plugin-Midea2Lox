Z3_37 = "Virtueller Ausgang Befehl (Vorlage „LoxBerry MQTT-Gateway“, MQTT) | Midea2Lox: Leistungsbegrenzung 50 Prozent | Befehl bei EIN: publish Midea2Lox/befehl/123456789012/leistungsstufe gear_50 (nie retain); Leistung auf etwa die Hälfte begrenzt; Haken wie Nr. 2 | Eingang = Ausgang Q2 von #35"
Z3_38 = "Virtueller Ausgang Befehl (Vorlage „LoxBerry MQTT-Gateway“, MQTT) | Midea2Lox: Leistungsbegrenzung 75 Prozent | Befehl bei EIN: publish Midea2Lox/befehl/123456789012/leistungsstufe gear_75 (nie retain); Leistung auf etwa drei Viertel begrenzt; Haken wie Nr. 2 | Eingang = Ausgang Q3 von #35"
Z3_39 = "Virtueller Texteingang | Midea2Lox_123456789012_rate_select | von Hand anlegen, Name genau so (Name, den das MQTT-Gateway vergibt), „In Visualisierung verwenden“ an; Leistungsstufe, wie das Gerät sie meldet: „OFF“, „GEAR_50“, „GEAR_75“ (andere Geräte „LEVEL_1“ bis „LEVEL_5“), „-“ = das Gerät kann es nicht; zurückbehalten; Fassung 2: Haken | —"
Z3_40 = "Status | Leistung (Midea) | Zeilen: V1 = 2 „auf 50 Prozent begrenzt gewählt – das Gerät meldet <v2>“; V1 = 3 „auf 75 Prozent begrenzt gewählt – das Gerät meldet <v2>“; V1 = 1 „ohne Begrenzung gewählt – das Gerät meldet <v2>“; ohne Bedingung „in der App nichts gewählt – das Gerät meldet <v2> („-“ = kann es nicht)“; Visualisierung EIN | V1 = #35, V2 = #39"
SEITE3_H5 = "<b>Zu Nr. 35 bis 40:</b> Leistungsbegrenzung nur bei Geräten, die sie melden (Fähigkeitsliste im Plugin-Protokoll, supported_rate_selects); andere quittieren „abgelehnt: KANN_DAS_GERAET_NICHT“, und der Texteingang Nr. 39 zeigt „-“. Die Stufen LEVEL_1–5 stehen nur in den Vorlagen des Plugins."

