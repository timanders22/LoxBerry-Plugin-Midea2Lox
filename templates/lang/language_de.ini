AUTO_S2_WARNUNG = "<b>Ein- und Ausschalten ist der tiefste Eingriff.</b> Die Automatik schaltet ein Gerät nur dann wieder aus, wenn <b>sie es selbst eingeschaltet hat</b>. Ein Gerät, das Sie eingeschaltet vorgefunden haben, bleibt an."
AUTO_S3 = "Schritt 3: Vorrang und Sicherheitsnetz"
AUTO_S3_TEXT = "Jeder Befehl aus Loxone oder vom Reiter Test setzt die Automatik für die Sperrzeit aus - eine reine Statusabfrage nicht. Sie stellt dabei den Sollwert zurück, <b>schaltet aber nicht</b>: ein Gerät, das Sie gerade eingeschaltet haben, würde sie sonst Sekunden später wieder ausschalten. Bleibt ein Signal dagegen länger aus als die Höchstdauer, ist niemand da, der etwas anderes wollte - dann stellt sie den vorgefundenen Zustand ganz wieder her, auch geschaltet."
AUTO_S4 = "Was die Automatik selbst veröffentlicht"
