VK_S_HINWEIS = "Einspeisung und Bezug kommen vom Plugin Smartmeter (dort Reiter MQTT: „Werte für andere Plugins bereitstellen (haus/energie)“); ab Smartmeter 2.8.19 auch <span class='sm-mono'>frei_w</span>, das einen Hausakku mitrechnet – dann gilt diese Größe, sonst Einspeisung und Bezug. Schweigt diese Quelle oder meldet sie keine frische Messung, wird <b>nichts eingeschaltet</b>; fällt sie während einer Vorkühlung länger als 5 Minuten aus, wird regulär ausgeschaltet. Bei offenem Fenster, solange die Anwesenheitskopplung oder die Automatik das Gerät hält, wird nicht eingeschaltet. Jede Aktion steht im Protokoll und kurz unter &lt;Präfix&gt;/vorkuehlen/meldung; der Reiter Test zeigt, worauf jedes Gerät wartet und welche Größe gilt. Der zweite Haken der MQTT-Befehle ist dafür nicht nötig: er schützt den Eingang für fremde Befehle, dieser Schalter hier ist Ihre Zustimmung."
