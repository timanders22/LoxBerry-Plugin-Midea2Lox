; Midea2Lox - deutsche Texte
;
; Gelesen von mi_t() in webfrontend/htmlauth/mi_lib.php.
; Die Schluessel muessen mit language_en.ini deckungsgleich sein; Englisch
; ist die Rueckfallebene fuer jede Sprache ohne eigene Datei.
;
; Bis 4.0.0 war die Oberflaeche einsprachig: mi_t() und mi_sprache() waren
; gebaut und ein Dutzend Schluessel angelegt - die uebrigen 225 sichtbaren
; Texte standen fest im index.php. Jetzt geht jeder davon hier durch.
;
; ZWEI FALLEN, beide beim Umbau aufgelaufen:
;
; 1. Werte MUESSEN in Anfuehrungszeichen stehen. PHP weist einen INI-Wert
;    mit &, (, ), ! oder ? sonst als Syntaxfehler zurueck - und dann faellt
;    die GANZE Datei aus, nicht nur die eine Zeile. mi_t() schneidet die
;    Anfuehrungszeichen beim Lesen wieder ab (INI_SCANNER_RAW liefert sie
;    mit).
; 2. Schluesselnamen duerfen nicht TRUE, FALSE, ON, OFF, YES, NO, NULL oder
;    NONE heissen - das sind fuer den INI-Parser Schluesselwoerter. Der
;    Schluessel fuer den Text "True" heisst deshalb WERT_TRUE.
;
; Werte NICHT ueber mehrere Zeilen umbrechen: INI kennt das nicht.
;
; Der Abschnitt [UI] enthaelt HTML - Umlaute als Entitaet (ä), weil die
; Texte ungefiltert in die Seite gehen.

